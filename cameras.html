<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Apollo Run - Multi Caméras</title>

<style>
  

  
body{
margin:0;
font-family:Arial;
background:#111;
color:white;
height:100vh;
display:flex;
flex-direction:column;
}
  
#chrono{
margin-left:auto;
padding:15px 25px;
font-size:24px;
font-weight:bold;
color:#ffcc00;
}

/* barre onglets */

.tabs{
display:flex;
background:#000;
border-bottom:2px solid #333;
}

.tab{
padding:15px 20px;
cursor:pointer;
border-right:1px solid #333;
}

.tab.active{
background:#333;
}

/* contenu */

.content{
display:none;
padding:15px;
flex:1;
overflow:hidden;
}

.content.active{
display:block;
}

/* grille 2x2 */

.grid{
display:grid;
grid-template-columns:1fr 1fr;
grid-template-rows:1fr 1fr;
gap:15px;
height:100%;
}

/* caméra */

.camera{
background:black;
border:2px solid #333;
height:100%;
}

iframe{
width:100%;
height:100%;
border:none;
}

@media(max-width:900px){

.grid{
grid-template-columns:1fr;
}

}

</style>
</head>

<body>

<!-- onglets -->

<div class="tabs">

<div class="tab active" data-target="live">
2 caméras + résultats
</div>
  
  <div class="tab" data-target="all">
3 caméras + résultats
</div>
  

<div class="tab" data-target="cam1">
Caméra 1
</div>

<div class="tab" data-target="cam2">
Caméra 2
</div>

<div class="tab" data-target="cam3">
Caméra 3
</div>

<div class="tab" data-target="cam4">
Résultats
</div>

  <div class="tab" data-target="cam4">
Chrono
</div>

<div id="chrono">00:00:00</div>

</div>

<!-- COURSE LIVE -->

<div id="live" class="content active">

<div style="
display:grid;
grid-template-columns:40% 60%;
gap:15px;
height:100%;
">

  <!-- CAMERAS A GAUCHE -->

  <div style="
  display:grid;
  grid-template-rows:1fr 1fr;
  gap:15px;
  height:100%;
  ">

    <div class="camera">
      <iframe src="https://vdo.ninja/?view=ApolloRunAcam1&cleanoutput&transparent&autoplay"></iframe>
    </div>

    <div class="camera">
    <iframe src="https://vdo.ninja/?view=ApolloRunBcam2&cleanoutput&transparent&autoplay"></iframe>
    </div>

  </div>

  <!-- RESULTATS A DROITE -->

<div class="camera" id="resultatsContainer" style="
overflow-y:auto;
height:100%;
">

  <iframe
  src="https://cochpain.github.io/scan-course/resultats.html">
  </iframe>

</div>

</div>

</div>
<!-- vue globale -->

<div id="all" class="content">

<div class="grid">

<div class="camera">
<iframe src="https://vdo.ninja/?view=ApolloRunAcam1&cleanoutput&transparent&autoplay"></iframe>
</div>

<div class="camera">
<iframe src="https://vdo.ninja/?view=ApolloRunBcam2&cleanoutput&transparent&autoplay"></iframe>
</div>

<div class="camera">
<iframe src="https://vdo.ninja/?view=ApolloRunCcam3&cleanoutput&transparent&autoplay"></iframe>
</div>

<div class="camera">
<iframe src="https://cochpain.github.io/scan-course/resultats.html"></iframe>
</div>

</div>

</div>


<!-- cam1 -->

<div id="cam1" class="content">

<div class="camera">

<iframe src="https://vdo.ninja/?view=ApolloRunAcam1&cleanoutput&transparent&autoplay"></iframe>

</div>

</div>


<!-- cam2 -->

<div id="cam2" class="content">

<div class="camera">

<iframe src="https://vdo.ninja/?view=ApolloRunBcam2&cleanoutput&transparent&autoplay"></iframe>

</div>

</div>


<!-- cam3 -->

<div id="cam3" class="content">

<div class="camera">

<iframe src="https://vdo.ninja/?view=ApolloRunCcam3&cleanoutput&transparent&autoplay"></iframe>

</div>

</div>


<!-- cam4 -->

<div id="cam4" class="content">

<div class="camera">

<iframe src="https://cochpain.github.io/scan-course/resultats.html"></iframe>

</div>

</div>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let startMs = null;
let chronoInterval = null;

function afficherChrono(){

  const el = document.getElementById("chrono");

  if(!startMs){
    el.textContent = "00:00:00";
    return;
  }

  if(chronoInterval) clearInterval(chronoInterval);

  chronoInterval = setInterval(()=>{
    const diff = Date.now() - startMs;

    const s = Math.floor(diff/1000);
    const h = String(Math.floor(s/3600)).padStart(2,"0");
    const m = String(Math.floor((s%3600)/60)).padStart(2,"0");
    const sec = String(s%60).padStart(2,"0");

    el.textContent = h + ":" + m + ":" + sec;
  },1000);
}

/* 🔥 écoute en temps réel du chrono */
onSnapshot(doc(db,"course","depart"), snap=>{

  if(snap.exists()){
    startMs = snap.data().startMs ?? null;
  } else {
    startMs = null;
  }

  afficherChrono();
});

</script>


<script>

/* gestion onglets */

document.querySelectorAll(".tab").forEach(tab=>{

tab.addEventListener("click",()=>{

document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
document.querySelectorAll(".content").forEach(c=>c.classList.remove("active"));

tab.classList.add("active");

document.getElementById(tab.dataset.target).classList.add("active");

});

});

</script>

<script>

let dir = 1;
let pause = false;

setInterval(() => {

  const liveTab = document.getElementById("live");

  if(!liveTab.classList.contains("active")) return;

  const container = document.getElementById("resultatsContainer");

  if(!container) return;

  const maxScroll =
    container.scrollHeight - container.clientHeight;

  if(maxScroll <= 0) return;

  if(pause) return;

  container.scrollTop += dir;

  if(container.scrollTop >= maxScroll){

    pause = true;

    setTimeout(() => {
      dir = -1;
      pause = false;
    },3000);
  }

  if(container.scrollTop <= 0 && dir < 0){

    pause = true;

    setTimeout(() => {
      dir = 1;
      pause = false;
    },3000);
  }

},40);

</script>
</body>
</html>
