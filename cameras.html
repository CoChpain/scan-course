<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Apollo Run - Multi Caméras</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #111;
  color: white;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

#chrono {
  margin-left: auto;
  padding: 15px 25px;
  font-size: 24px;
  font-weight: bold;
  color: #ffcc00;
}

/* Barre d'onglets */
.tabs {
  display: flex;
  background: #000;
  border-bottom: 2px solid #333;
}

.tab {
  padding: 15px 20px;
  cursor: pointer;
  border-right: 1px solid #333;
}

.tab.active {
  background: #333;
}

/* Contenu des onglets */
.content {
  display: none;
  padding: 0;
  height: calc(100vh - 60px); /* Ajusté pour tenir compte de la barre d'onglets */
  overflow: hidden;
}

.content.active {
  display: block;
}

/* Grille pour 2 caméras côte à côte */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  height: 100%;
  width: 100%;
  padding: 15px;
  box-sizing: border-box;
}

/* Grille pour 2 caméras verticales */
.vertical-cams {
  display: grid;
  grid-template-rows: 1fr 1fr;
  gap: 15px;
  height: 100%;
  padding: 15px;
  box-sizing: border-box;
}

/* Style des caméras */
.camera {
  background: black;
  border: 2px solid #333;
  height: 100%;
  width: 100%;
}

iframe {
  width: 100%;
  height: 100%;
  border: none;
}

@media (max-width: 900px) {
  .grid {
    grid-template-columns: 1fr;
  }
}

/* Slider des partenaires */
.partners-slider {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  overflow: hidden;
  background: #111;
  border-top: 2px solid #00ffcc;
  z-index: 999;
  height: 100px;
}

.partners-track {
  display: flex;
  width: max-content;
  animation: scroll 30s linear infinite;
  height: 100%;
  align-items: center;
}

.partners-track img {
  height: 80px;
  margin: 0 40px;
  object-fit: contain;
  flex-shrink: 0;
}

@keyframes scroll {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}
</style>
</head>

<body>

<!-- Barre d'onglets -->
<div class="tabs">
  <div class="tab active" data-target="live">
    2 caméras + résultats
  </div>
  <div class="tab" data-target="all">
    2 caméras V
  </div>
  <div class="tab" data-target="all1">
    2 caméras H
  </div>
  <div class="tab" data-target="cam1">
    Caméra 1
  </div>
  <div class="tab" data-target="cam2">
    Caméra 2
  </div>
  <div class="tab" data-target="cam3">
    Caméra 3
  </div>
  <div class="tab" data-target="cam4">
    Résultats
  </div>
  <div class="tab">
    Chrono
  </div>
  <div id="chrono">00:00:00</div>
</div>

<!-- Contenu : 2 caméras + résultats -->
<div id="live" class="content active">
  <div style="display: grid; grid-template-columns: 40% 60%; gap: 15px; height: 100%;">
    <!-- Caméras à gauche -->
    <div style="display: grid; grid-template-rows: 1fr 1fr; gap: 15px; height: 100%;">
      <div class="camera">
        <iframe src="https://vdo.ninja/?view=ApolloRunAcam1&cleanoutput&transparent&autoplay"></iframe>
      </div>
      <div class="camera">
        <iframe src="https://vdo.ninja/?view=ApolloRunBcam2&cleanoutput&transparent&autoplay"></iframe>
      </div>
    </div>
    <!-- Résultats à droite -->
    <div class="camera" id="resultatsContainer" style="overflow-y: auto; height: 100%;">
      <iframe src="https://cochpain.github.io/scan-course/resultats.html"></iframe>
    </div>
  </div>
</div>

<!-- Contenu : 2 caméras H -->
<div id="all" class="content">
  <div class="grid">
    <div class="camera">
      <iframe src="https://vdo.ninja/?view=ApolloRunAcam1&cleanoutput&transparent&autoplay"></iframe>
    </div>
    <div class="camera">
      <iframe src="https://vdo.ninja/?view=ApolloRunBcam2&cleanoutput&transparent&autoplay"></iframe>
    </div>
  </div>
</div>

<!-- Contenu : 2 caméras V -->
<div id="all1" class="content">
  <div class="vertical-cams">
    <div class="camera">
      <iframe src="https://vdo.ninja/?view=ApolloRunAcam1&cleanoutput&transparent&autoplay"></iframe>
    </div>
    <div class="camera">
      <iframe src="https://vdo.ninja/?view=ApolloRunBcam2&cleanoutput&transparent&autoplay"></iframe>
    </div>
  </div>
</div>

<!-- Contenu : Caméra 1 -->
<div id="cam1" class="content">
  <div class="camera">
    <iframe src="https://vdo.ninja/?view=ApolloRunAcam1&cleanoutput&transparent&autoplay"></iframe>
  </div>
</div>

<!-- Contenu : Caméra 2 -->
<div id="cam2" class="content">
  <div class="camera">
    <iframe src="https://vdo.ninja/?view=ApolloRunBcam2&cleanoutput&transparent&autoplay"></iframe>
  </div>
</div>

<!-- Contenu : Caméra 3 -->
<div id="cam3" class="content">
  <div class="camera">
    <iframe src="https://vdo.ninja/?view=ApolloRunCcam3&cleanoutput&transparent&autoplay"></iframe>
  </div>
</div>

<!-- Contenu : Résultats -->
<div id="cam4" class="content">
  <div class="camera">
    <iframe src="https://cochpain.github.io/scan-course/resultats.html"></iframe>
  </div>
</div>

<!-- Contenu : Chrono -->
<div id="chrono-content" class="content" style="position: relative; height: 100%;">
  <div style="display: flex; justify-content: center; align-items: center; height: calc(100% - 100px);">
    <div id="big-chrono" style="font-size: 200px; font-weight: bold; color: #ffcc00;">00:00:00</div>
  </div>
  <div style="text-align: center; margin-top: 20px; font-size: 28px; color: #ffffff; font-weight: 500;">
  Merci de vous rendre au PC course dès l’arrêt de votre participation (abandon ou non‑partant) afin de récupérer votre médaille.
</div>

  
  <!-- Slider des partenaires -->
  <div class="partners-slider">
    <div class="partners-track">
      <img src="Z1.png">
      <img src="Z2.png">
      <img src="Z3.png">
      <img src="Z4.png">
      <img src="Z5.png">
      <img src="Z6.png">
      <img src="Z7.png">
      <img src="Z8.png">
      <!-- Duplication pour une boucle infinie -->
      <img src="Z1.png">
      <img src="Z2.png">
      <img src="Z3.png">
      <img src="Z4.png">
      <img src="Z5.png">
      <img src="Z6.png">
      <img src="Z7.png">
      <img src="Z8.png">
    </div>
  </div>
</div>

<!-- Scripts -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
  import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";
  import { firebaseConfig } from "./firebase-config.js";

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let startMs = null;
  let chronoInterval = null;

  function afficherChrono() {
    const el = document.getElementById("chrono");
    const bigEl = document.getElementById("big-chrono");

    if (!startMs) {
      el.textContent = "00:00:00";
      if (bigEl) bigEl.textContent = "00:00:00";
      return;
    }

    if (chronoInterval) clearInterval(chronoInterval);

    chronoInterval = setInterval(() => {
      const diff = Date.now() - startMs;
      const s = Math.floor(diff / 1000);
      const h = String(Math.floor(s / 3600)).padStart(2, "0");
      const m = String(Math.floor((s % 3600) / 60)).padStart(2, "0");
      const sec = String(s % 60).padStart(2, "0");

      const timeString = h + ":" + m + ":" + sec;
      el.textContent = timeString;
      if (bigEl) bigEl.textContent = timeString;
    }, 1000);
  }

  /* Écoute en temps réel du chrono */
  onSnapshot(doc(db, "course", "depart"), snap => {
    if (snap.exists()) {
      startMs = snap.data().startMs ?? null;
    } else {
      startMs = null;
    }
    afficherChrono();
  });
</script>

<script>
  /* Gestion des onglets */
  document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      document.querySelectorAll(".content").forEach(c => c.classList.remove("active"));

      tab.classList.add("active");

      if (tab.textContent.trim() === "Chrono") {
        document.getElementById("chrono-content").classList.add("active");
      } else {
        document.getElementById(tab.dataset.target).classList.add("active");
      }
    });
  });
</script>

<script>
  let dir = 1;
  let pause = false;

  setInterval(() => {
    const liveTab = document.getElementById("live");
    if (!liveTab.classList.contains("active")) return;

    const container = document.getElementById("resultatsContainer");
    if (!container) return;

    const maxScroll = container.scrollHeight - container.clientHeight;
    if (maxScroll <= 0) return;

    if (pause) return;

    container.scrollTop += dir;

    if (container.scrollTop >= maxScroll) {
      pause = true;
      setTimeout(() => {
        dir = -1;
        pause = false;
      }, 3000);
    }

    if (container.scrollTop <= 0 && dir < 0) {
      pause = true;
      setTimeout(() => {
        dir = 1;
        pause = false;
      }, 3000);
    }
  }, 40);
</script>
</body>
</html>
