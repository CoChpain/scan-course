<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><title>ADMIN – APOLLO RUN</title><style>body{background:#000;color:#fff;font-family:Arial;text-align:center}.tabs{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:20px}.tab-btn{background:#111;color:#fff;border:1px solid #444;border-radius:8px;padding:12px 20px;cursor:pointer}.tab-btn.active{background:#0099ff}.tab-content{display:none}.tab-content.active{display:block}</style></head><body><h1>🛠️ ADMIN – Gestion de la course</h1><div class="tabs"><button class="tab-btn active" onclick="openTab('chrono',this)">⏱️ Chrono</button><button class="tab-btn" onclick="openTab('modifier',this)">✏️ Modifier un résultat</button><button class="tab-btn" onclick="openTab('resultats',this)">🧹 Réinitialiser les résultats</button><button class="tab-btn" onclick="openTab('coureurs',this)">🗑️ Base coureurs</button></div><div id="chrono" class="tab-content active"><h2>⏱️ Départ de la course</h2><button id="btn-start">🚀 Lancer le chrono</button><button id="btn-reset">🔁 Réinitialiser le chrono</button><div id="chrono-status"></div><h2>⏱️ Durée des tours</h2><div id="tour-settings"></div></div><div id="modifier" class="tab-content"><h2>🔍 Rechercher un coureur</h2><input id="search-dossard"><div id="runner-info"></div><div id="scan-list"></div><h2>➕ Ajouter un scan</h2><input id="add-dossard"><input id="add-tour"><input id="add-time"></div><div id="resultats" class="tab-content"><h2>🧹 Réinitialiser les résultats</h2><button onclick="resetResultats()">Supprimer tous les résultats</button><div id="reset-resultats-status"></div></div><div id="coureurs" class="tab-content"><h2>➕ Ajouter / Modifier un coureur</h2><div id="table-coureurs"></div><button onclick="resetCoureurs()">Supprimer tous les coureurs</button></div><script>function openTab(id,b){document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.tab-btn').forEach(t=>t.classList.remove('active'));document.getElementById(id).classList.add('active');b.classList.add('active');}</script></body></html>
