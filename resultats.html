<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Résultats – APOLLO RUN</title>
  <style>
    body {
      background: #000;
      color: white;
      font-family: Arial;
      text-align: center;
    }

    .columns {
      display: grid;
      gap: 10px;
      width: 98%;
      margin: auto;
    }

    .cols-1 { grid-template-columns: repeat(1, 1fr); }
    .cols-2 { grid-template-columns: repeat(2, 1fr); }
    .cols-3 { grid-template-columns: repeat(3, 1fr); }
    .cols-4 { grid-template-columns: repeat(4, 1fr); }

    @media (max-width: 768px) {
      .cols-4, .cols-3, .cols-2, .cols-1 {
        grid-template-columns: repeat(1, 1fr);
      }
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      border: 2px solid #555;
    }

    th, td {
      border: 1px solid #333;
      padding: 3px;
    }

    th {
      background: #111;
    }

    tr:nth-child(even) {
      background: rgba(255, 255, 255, 0.05);
    }

    .red {
      color: red;
      font-weight: bold;
    }

    .femme {
      color: #ff66cc;
      font-weight: bold;
    }

    .fade {
      animation: fade 0.4s;
    }

    @keyframes fade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    button {
      margin: 4px;
      padding: 8px 12px;
      font-size: 14px;
    }

    .partners-slider {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      overflow: hidden;
      background: #111;
      border-top: 2px solid #00ffcc;
      z-index: 999;
    }

    .partners-track {
      display: flex;
      width: max-content;
      animation: scroll 30s linear infinite;
    }

    .partners-track img {
      height: 80px;
      margin: 10px 40px;
      object-fit: contain;
      flex-shrink: 0;
    }

    @keyframes scroll {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    body {
      padding-bottom: 90px;
    }
  </style>
</head>

<body>
  <div id="chrono-global" style="font-size:28px;color:#ffcc00;margin-top:20px;">
    ⏱️ Chrono global : --:--:--
  </div>

  <div id="onglets" style="margin:20px"></div>
  <div id="contenu"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
    import {
      getFirestore, collection, query, orderBy, onSnapshot, doc, getDoc, getDocs, where, enableIndexedDbPersistence
    } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";
    import { firebaseConfig } from "./firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    enableIndexedDbPersistence(db)
      .catch((err) => {
        if (err.code == 'failed-precondition') {
          console.log("Persistance désactivée : plusieurs onglets ouverts.");
        }
      });

    // ======================
    // 💾 Cache global partagé
    // ======================
    const GLOBAL_CACHE_KEY = "apolloRunGlobalCache";
    let globalCache = {
      coureurs: {},
      resultats: {},
      limites: {},
      startMs: null,
      lastUpdated: 0
    };

    const cacheChannel = new BroadcastChannel('apollo-run-cache');

    function loadGlobalCache() {
      const saved = localStorage.getItem(GLOBAL_CACHE_KEY);
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          globalCache = { ...globalCache, ...parsed };
        } catch (e) {
          console.error("Erreur chargement cache global :", e);
        }
      }
    }

    function saveGlobalCache() {
      localStorage.setItem(GLOBAL_CACHE_KEY, JSON.stringify(globalCache));
      cacheChannel.postMessage({ type: 'cache-updated', data: globalCache });
    }

    async function updateGlobalCache() {
      const now = Date.now();
      if (now - globalCache.lastUpdated < 60000) return;

      try {
        const limitesDoc = await getDoc(doc(db, "course", "limitesTours"));
        if (limitesDoc.exists()) {
          globalCache.limites = limitesDoc.data();
        }

        const departDoc = await getDoc(doc(db, "course", "depart"));
        if (departDoc.exists()) {
          globalCache.startMs = departDoc.data().startMs;
        }

        const coureursSnap = await getDocs(collection(db, "coureurs"));
        globalCache.coureurs = {};
        coureursSnap.forEach(doc => {
          const data = doc.data();
          if (data.dossard) {
            globalCache.coureurs[data.dossard] = data;
          }
        });

        const resultatsSnap = await getDocs(query(collection(db, "resultats"), orderBy("timestamp", "asc")));
        globalCache.resultats = {};
        resultatsSnap.forEach(doc => {
          const data = doc.data();
          const ts = data.timestamp?.toDate?.()?.getTime?.() || data.timestamp;
          const key = data.type === "DNF" || data.type === "DNS"
            ? `${data.dossard}_${data.type}`
            : `${data.dossard}_${data.tour || 0}_${ts}`;
          globalCache.resultats[key] = data;
        });

        globalCache.lastUpdated = now;
        saveGlobalCache();
      } catch (error) {
        console.error("Erreur mise à jour cache global :", error);
      }
    }

    function calculateCurrentTour(startMs, limites) {
      if (!startMs || !limites) return 1;
      const elapsedMin = (Date.now() - startMs) / 60000;
      let cumul = 0;
      for (let i = 1; i <= 10; i++) {
        const limite = limites[`t${i}`];
        if (limite === undefined) break;
        cumul += limite;
        if (elapsedMin <= cumul) return i;
      }
      return 10;
    }

    const div = document.getElementById("contenu");
    let coureursMap = {};
    let tours = {};
    let tousLesResultats = {};
    let startMs = null;
    let limites = {};
    let departTours = {};
    let ongletActif = "general";
    let totalParTour = {};
    let currentTour = 1;

    loadGlobalCache();
    startMs = globalCache.startMs;
    limites = globalCache.limites;
    coureursMap = globalCache.coureurs;

    cacheChannel.onmessage = (e) => {
      if (e.data.type === 'cache-updated') {
        globalCache = e.data.data;
        startMs = globalCache.startMs;
        limites = globalCache.limites;
        coureursMap = globalCache.coureurs;

        if (startMs === null) {
          tours = {};
          tousLesResultats = {};
          totalParTour = {};
        } else {
          Object.entries(globalCache.resultats).forEach(([key, r]) => {
            const ts = r.timestamp?.toDate?.()?.getTime?.() || r.timestamp;
            const uniqueKey = r.type === "DNF" || r.type === "DNS"
              ? `${r.dossard}_${r.type}`
              : `${r.dossard}_${r.tour}_${ts}`;

            if (r.type === "DNF" || r.type === "DNS") {
              const tour = calculateCurrentTour(startMs, limites);
              if (!tours[tour]) tours[tour] = [];
              const exists = tours[tour].some(item =>
                (item.type === r.type && item.dossard === r.dossard)
              );
              if (!exists) {
                tours[tour].push({ ...r, tour, horsDelai: false, timestamp: ts });
              }
              if (!tousLesResultats[r.dossard]) tousLesResultats[r.dossard] = [];
              const existsInAll = tousLesResultats[r.dossard].some(item =>
                (item.type === r.type && item.dossard === r.dossard)
              );
              if (!existsInAll) {
                tousLesResultats[r.dossard].push({ ...r, tour, timestamp: ts });
              }
            } else {
              if (!r.tour || r.tour < 1 || r.tour > 10) return;
              if (!tours[r.tour]) tours[r.tour] = [];
              const exists = tours[r.tour].some(item =>
                `${item.dossard}_${item.tour}_${item.timestamp}` === uniqueKey
              );
              if (!exists) {
                tours[r.tour].push({ ...r, timestamp: ts });
              }
              if (!tousLesResultats[r.dossard]) tousLesResultats[r.dossard] = [];
              const existsInAll = tousLesResultats[r.dossard].some(item =>
                `${item.dossard}_${item.tour}_${item.timestamp}` === uniqueKey
              );
              if (!existsInAll) {
                tousLesResultats[r.dossard].push({ ...r, timestamp: ts });
              }
            }
          });
        }

        currentTour = calculateCurrentTour(startMs, limites);
        recalculerDepartTours();
        processResultsData();
        construireOnglets();
        rafraichir();
      }
    };

    async function loadAllTours() {
      try {
        Object.entries(globalCache.resultats).forEach(([key, r]) => {
          const ts = r.timestamp?.toDate?.()?.getTime?.() || r.timestamp;
          const uniqueKey = r.type === "DNF" || r.type === "DNS"
            ? `${r.dossard}_${r.type}`
            : `${r.dossard}_${r.tour}_${ts}`;

          if (r.type === "DNF" || r.type === "DNS") {
            const tour = calculateCurrentTour(startMs, limites);
            if (!tours[tour]) tours[tour] = [];
            const exists = tours[tour].some(item =>
              (item.type === r.type && item.dossard === r.dossard)
            );
            if (!exists) {
              tours[tour].push({ ...r, tour, horsDelai: false, timestamp: ts });
            }
            if (!tousLesResultats[r.dossard]) tousLesResultats[r.dossard] = [];
            const existsInAll = tousLesResultats[r.dossard].some(item =>
              (item.type === r.type && item.dossard === r.dossard)
            );
            if (!existsInAll) {
              tousLesResultats[r.dossard].push({ ...r, tour, timestamp: ts });
            }
          } else {
            if (!r.tour || r.tour < 1 || r.tour > 10) return;
            if (!tours[r.tour]) tours[r.tour] = [];
            const exists = tours[r.tour].some(item =>
              `${item.dossard}_${item.tour}_${item.timestamp}` === uniqueKey
            );
            if (!exists) {
              tours[r.tour].push({ ...r, timestamp: ts });
            }
            if (!tousLesResultats[r.dossard]) tousLesResultats[r.dossard] = [];
            const existsInAll = tousLesResultats[r.dossard].some(item =>
              `${item.dossard}_${item.tour}_${item.timestamp}` === uniqueKey
            );
            if (!existsInAll) {
              tousLesResultats[r.dossard].push({ ...r, timestamp: ts });
            }
          }
        });
        processResultsData();
        construireOnglets();
        afficherGeneral();
      } catch (error) {
        console.error("Erreur chargement des tours :", error);
      }
    }

    loadAllTours();
    setInterval(updateGlobalCache, 60000);

    let unsubscribeResultats = null;
    unsubscribeResultats = onSnapshot(
      query(collection(db, "resultats"), orderBy("timestamp", "asc")),
      snap => {
        snap.docChanges().forEach(change => {
          const r = change.doc.data();
          const ts = r.timestamp?.toDate?.()?.getTime?.() || r.timestamp;
          const uniqueKey = r.type === "DNF" || r.type === "DNS"
            ? `${r.dossard}_${r.type}`
            : `${r.dossard}_${r.tour}_${ts}`;

          if (change.type === "removed") {
            if (r.type === "DNF" || r.type === "DNS") {
              const tour = calculateCurrentTour(startMs, limites);
              if (tours[tour]) {
                tours[tour] = tours[tour].filter(item =>
                  !(item.type === r.type && item.dossard === r.dossard)
                );
              }
              if (tousLesResultats[r.dossard]) {
                tousLesResultats[r.dossard] = tousLesResultats[r.dossard].filter(item =>
                  !(item.type === r.type && item.dossard === r.dossard)
                );
              }
            } else {
              if (tours[r.tour]) {
                tours[r.tour] = tours[r.tour].filter(item =>
                  `${item.dossard}_${item.tour}_${item.timestamp}` !== uniqueKey
                );
              }
              if (tousLesResultats[r.dossard]) {
                tousLesResultats[r.dossard] = tousLesResultats[r.dossard].filter(item =>
                  `${item.dossard}_${item.tour}_${item.timestamp}` !== uniqueKey
                );
              }
            }
            delete globalCache.resultats[uniqueKey];
          } else {
            if (r.type === "DNF" || r.type === "DNS") {
              const tour = calculateCurrentTour(startMs, limites);
              if (!tours[tour]) tours[tour] = [];
              const exists = tours[tour].some(item =>
                (item.type === r.type && item.dossard === r.dossard)
              );
              if (!exists) {
                tours[tour].push({ ...r, tour, horsDelai: false, timestamp: ts });
              }
              if (!tousLesResultats[r.dossard]) tousLesResultats[r.dossard] = [];
              const existsInAll = tousLesResultats[r.dossard].some(item =>
                (item.type === r.type && item.dossard === r.dossard)
              );
              if (!existsInAll) {
                tousLesResultats[r.dossard].push({ ...r, tour, timestamp: ts });
              }
            } else {
              if (!r.tour || r.tour < 1 || r.tour > 10) return;
              if (!tours[r.tour]) tours[r.tour] = [];
              // 🔥 Supprimer les doublons avant d'ajouter
              tours[r.tour] = tours[r.tour].filter(item =>
                `${item.dossard}_${item.tour}_${item.timestamp}` !== uniqueKey
              );
              tousLesResultats[r.dossard] = (tousLesResultats[r.dossard] || []).filter(item =>
                `${item.dossard}_${item.tour}_${item.timestamp}` !== uniqueKey
              );
              tours[r.tour].push({ ...r, timestamp: ts });
              if (!tousLesResultats[r.dossard]) tousLesResultats[r.dossard] = [];
              tousLesResultats[r.dossard].push({ ...r, timestamp: ts });
            }
            globalCache.resultats[uniqueKey] = r;
          }
        });
        saveGlobalCache();
        processResultsData();
        construireOnglets();
        rafraichir();
      }
    );

    onSnapshot(collection(db, "coureurs"), snap => {
      snap.docChanges().forEach(change => {
        const data = change.doc.data();
        if (!data.dossard || Number(data.dossard) <= 0) return;
        globalCache.coureurs[data.dossard] = data;
        coureursMap[data.dossard] = data;
      });
      saveGlobalCache();
      construireOnglets();
      rafraichir();
    });

    onSnapshot(doc(db, "course", "depart"), snap => {
      if (snap.exists()) {
        startMs = snap.data().startMs;
        globalCache.startMs = startMs;
        saveGlobalCache();
        recalculerDepartTours();
        currentTour = calculateCurrentTour(startMs, limites);
        rafraichir();
      } else {
        startMs = null;
        globalCache.startMs = null;
        saveGlobalCache();
        recalculerDepartTours();
        rafraichir();
      }
    });

    onSnapshot(doc(db, "course", "limitesTours"), snap => {
      if (snap.exists()) {
        limites = snap.data();
        globalCache.limites = limites;
        saveGlobalCache();
        recalculerDepartTours();
        currentTour = calculateCurrentTour(startMs, limites);
        rafraichir();
      }
    });

    function recalculerDepartTours() {
      if (!startMs || !limites) return;
      departTours = {};
      let cumul = 0;
      for (let i = 1; i <= 10; i++) {
        if (!limites["t" + i]) break;
        departTours[i] = startMs + cumul * 60000;
        cumul += limites["t" + i];
      }
    }

    function formatTemps(ms) {
      if (ms === null || ms === undefined || ms < 0) return "--:--:--";
      const s = Math.floor(ms / 1000);
      const h = String(Math.floor(s / 3600)).padStart(2, "0");
      const m = String(Math.floor((s % 3600) / 60)).padStart(2, "0");
      const sec = String(s % 60).padStart(2, "0");
      return `${h}:${m}:${sec}`;
    }

    function getNombreColonnes(nb) {
      const largeur = window.innerWidth;
      if (largeur < 1400) {
        return nb < 20 ? 1 : 2;
      }
      let cols = 4;
      if (nb < 20) cols = 1;
      else if (nb < 50) cols = 2;
      else if (nb < 90) cols = 3;
      return cols;
    }

    function updateChronos() {
      if (!startMs) return;
      const now = Date.now();
      const globalMs = now - startMs;
      document.getElementById("chrono-global").innerHTML =
        "⏱️ Chrono global : " + formatTemps(globalMs);

      if (ongletActif !== "general" && departTours[ongletActif]) {
        const tourMs = now - departTours[ongletActif];
        const chronoTour = document.getElementById("chrono-tour");
        if (chronoTour) {
          chronoTour.innerHTML =
            "⏱️ Chrono Tour " + ongletActif + " : " + formatTemps(tourMs);
        }
      }
    }

    // 🔥 Mettre à jour le chrono toutes les secondes (pas toutes les 10 secondes)
    setInterval(updateChronos, 1000);

    function calculTempsTour(dossard, tour) {
      if (!departTours[tour]) return null;
      const scans = tousLesResultats[dossard] || [];
      const scanTour = scans.find(r => r.tour === tour);
      if (!scanTour || !scanTour.timestamp) return null;
      return scanTour.timestamp - departTours[tour];
    }

    function construireOnglets() {
      let html = `<button onclick="afficherGeneral()">Général</button>`;
      let tourMax = 1;

      Object.keys(tours).forEach(t => {
        const num = Number(t);
        if (num > tourMax && num <= 10) tourMax = num;
      });

      if (startMs) {
        currentTour = calculateCurrentTour(startMs, limites);
        tourMax = Math.max(tourMax, currentTour);
      }

      for (let t = 1; t <= Math.min(tourMax, 10); t++) {
        html += `<button onclick="afficherTour(${t})">Tour ${t}</button>`;
      }

      document.getElementById("onglets").innerHTML = html;
    }

    window.afficherTour = function(tour) {
      ongletActif = tour;
      recalculerDepartTours();

      // Filtrer les coureurs éliminés (DNF/DNS/ELIMINE) pour ce tour et les suivants
      let liste = (tours[tour] || []).filter(r => {
        const coureur = coureursMap[r.dossard];
        if (!coureur) return false;

        // Exclure les coureurs DNF/DNS/ELIMINE pour les tours suivants
        if (tour > 1) {
          const lastScan = tousLesResultats[r.dossard]?.find(s => s.tour === tour - 1);
          if (lastScan && (lastScan.dnf || lastScan.dns || lastScan.horsDelai)) {
            return false;
          }
        }

        // Exclure les coureurs ELIMINE/DNF/DNS pour le tour actuel
        if (["DNF", "DNS", "ELIMINE"].includes(coureur.statut)) {
          return false;
        }

        return true;
      });

      // 🔥 Supprimer les doublons dans la liste
      const uniqueListe = [];
      const seen = new Set();
      liste.forEach(r => {
        const key = r.type === "DNF" || r.type === "DNS"
          ? `${r.dossard}_${r.type}`
          : `${r.dossard}_${r.tour}_${r.timestamp}`;
        if (!seen.has(key)) {
          seen.add(key);
          uniqueListe.push(r);
        }
      });
      liste = uniqueListe;

      let total = 0, arrives = 0;

      if (tour === 1) {
        total = Object.values(coureursMap)
          .filter(c => c.dossard && Number(c.dossard) > 0)
          .filter(c => !["DNF", "DNS", "ELIMINE"].includes(c.statut))
          .length;
      } else {
        total = (tours[tour - 1] || [])
          .filter(r => {
            const c = coureursMap[r.dossard];
            return c && !["DNF", "DNS", "ELIMINE"].includes(c.statut);
          })
          .filter(r => !r.horsDelai).length;
      }

      arrives = liste.filter(r => !r.horsDelai).length;
      const limite = limites["t" + tour] || 0;

      let html = `
        <h2>Tour ${tour}</h2>
        <div id="chrono-tour" style="font-size:22px;color:#00ffaa;margin-bottom:10px;">
          ⏱️ Chrono Tour ${tour} : --:--:--
        </div>
        <h3 style="color:#00ff99">⏱️ Temps maximum : ${formatTemps(limite * 60000)}</h3>
        <h3 style="color:yellow">Arrivés : ${arrives} / ${totalParTour[tour] ?? total}</h3>
      `;

      const nb = liste.length;
      const cols = getNombreColonnes(nb);
      html += `<div class="columns cols-${cols}">`;

      const chunk = Math.ceil(nb / cols);
      let colonnes = [];
      for (let i = 0; i < cols; i++) {
        colonnes.push(liste.slice(i * chunk, (i + 1) * chunk));
      }

      let rank = 1;
      colonnes.forEach(col => {
        html += `
          <table>
          <tr><th>#</th><th>Dossard</th><th>Nom</th><th>Temps</th></tr>
        `;
        col.forEach(r => {
          const c = coureursMap[r.dossard] || {};
          const tempsTour = calculTempsTour(r.dossard, tour);
          const classe = r.horsDelai ? "red fade" : (c.sexe === "F" ? "femme fade" : "fade");

          // 🔥 Afficher le temps en rouge si hors délai, sinon en normal
          const labelTemps = r.horsDelai
            ? `<span style="color:red">${formatTemps(tempsTour)}</span>`
            : formatTemps(tempsTour);

          html += `
            <tr class="${classe}">
              <td>${rank++}</td>
              <td>${r.dossard}</td>
              <td>${c.nom || ""} ${c.prenom || ""}</td>
              <td>${labelTemps}</td>
            </tr>`;
        });
        html += "</table>";
      });

      html += "</div>";
      div.innerHTML = html;
    };

    window.afficherGeneral = function() {
      ongletActif = "general";

      let classement = [];

      Object.values(coureursMap).forEach(c => {
        const scans = tousLesResultats[c.dossard] || [];
        const lastTour = scans.length > 0 ? Math.max(...scans.map(r => r.tour || 0)) : 0;

        let rang = 9999;
        if (lastTour > 0 && tours[lastTour]) {
          const idx = tours[lastTour].findIndex(r => r.dossard == c.dossard);
          if (idx !== -1) rang = idx + 1;
        }

        let tourAtteint = lastTour;
        if (startMs && tourAtteint === 0) {
          tourAtteint = 1;
        }

        let statutTxt = "", statutOrdre = 0;

        if (c.statut === "DNF") {
          statutTxt = `DNF T${tourAtteint}`;
          statutOrdre = 3;
        }
        else if (c.statut === "DNS") {
          statutTxt = `DNS T${tourAtteint}`;
          statutOrdre = 4;
        }
        else if (c.statut === "ELIMINE") {
          statutTxt = `Hors délais T${tourAtteint}`;
          statutOrdre = 2;
        }
        else {
          statutTxt = `En course T${tourAtteint}`;
          statutOrdre = 1;
        }

        classement.push({
          dossard: c.dossard,
          nom: c.nom || "",
          prenom: c.prenom || "",
          tours: lastTour,
          tourAtteint: tourAtteint,
          rang: rang,
          statut: c.statut,
          statutTxt: statutTxt,
          statutOrdre: statutOrdre
        });
      });

      // Filtrer les doublons dans le classement général
      const uniqueClassement = [];
      const seenClassement = new Set();
      classement.forEach(r => {
        const key = `${r.dossard}`;
        if (!seenClassement.has(key)) {
          seenClassement.add(key);
          uniqueClassement.push(r);
        }
      });
      classement = uniqueClassement;

      classement.sort((a, b) => {
        if (b.tourAtteint !== a.tourAtteint)
          return b.tourAtteint - a.tourAtteint;
        if (a.statutOrdre !== b.statutOrdre)
          return a.statutOrdre - b.statutOrdre;
        return a.rang - b.rang;
      });

      const nb = classement.length;
      const cols = getNombreColonnes(nb);
      let html = `<h2>Classement général</h2><div class="columns cols-${cols}">`;

      const chunk = Math.ceil(nb / cols);
      let colonnes = [];
      for (let i = 0; i < cols; i++) {
        colonnes.push(classement.slice(i * chunk, (i + 1) * chunk));
      }

      let rank = 1;
      colonnes.forEach(col => {
        html += `
          <table>
          <tr><th>#</th><th>Dossard</th><th>Nom</th><th>Tours</th><th>Statut</th></tr>
        `;
        col.forEach(r => {
          const c = coureursMap[r.dossard] || {};
          const classe = ["DNF", "DNS", "ELIMINE"].includes(r.statut)
            ? "red fade"
            : (c.sexe === "F" ? "femme fade" : "fade");

          html += `
            <tr class="${classe}">
              <td>${rank++}</td>
              <td>${r.dossard}</td>
              <td>${r.nom} ${r.prenom}</td>
              <td>${r.tours}</td>
              <td>${r.statutTxt}</td>
            </tr>`;
        });
        html += "</table>";
      });

      html += "</div>";
      div.innerHTML = html;
    };

    function processResultsData() {
      totalParTour = {};

      Object.keys(tours).forEach(t => {
        const tour = Number(t);
        if (tour < 1 || tour > 10) return;
        const limite = limites[`t${tour}`] || 0;
        const departTheorique = departTours[tour];
        if (!departTheorique) return;

        tours[tour] = tours[tour].map(r => {
          if (!r.timestamp) return r;
          const diffMin = (r.timestamp - departTheorique) / 60000;
          return { ...r, horsDelai: diffMin > limite };
        });
      });

      Object.keys(tours).forEach(t => {
        if (t < 1 || t > 10) return;
        tours[t].forEach(r => {
          if (r.horsDelai) {
            const c = coureursMap[r.dossard];
            if (c) c.statut = "ELIMINE";
          }
        });
      });

      Object.keys(limites).forEach(key => {
        const t = Number(key.replace("t", ""));
        if (!t || t < 1 || t > 10) return;
        let total = 0;
        if (t === 1) {
          total = Object.values(coureursMap)
            .filter(c => c.dossard && Number(c.dossard) > 0)
            .filter(c => !["DNF", "DNS", "ELIMINE"].includes(c.statut))
            .length;
        } else {
          total = (tours[t - 1] || [])
            .filter(r => !r.horsDelai)
            .filter(r => {
              const c = coureursMap[r.dossard];
              return c && !["DNF", "DNS", "ELIMINE"].includes(c.statut);
            }).length;
        }
        totalParTour[t] = total;
      });
    }

    function rafraichir() {
      if (ongletActif === "general") afficherGeneral();
      else afficherTour(Number(ongletActif));
    }

    // 🔥 Supprimer le rafraîchissement forcé toutes les 10 secondes (inutile avec les écouteurs)
    // setInterval(() => {
    //   if (ongletActif === "general") afficherGeneral();
    //   else if (ongletActif !== "general") afficherTour(Number(ongletActif));
    // }, 10000);

    window.addEventListener("beforeunload", () => {
      if (unsubscribeResultats) unsubscribeResultats();
      cacheChannel.close();
    });
  </script>

    let direction = 1;
    let pause = false;

    setInterval(() => {
      if (pause) return;
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      if (maxScroll <= 0) return;
      window.scrollBy(0, direction);

      if (window.scrollY >= maxScroll - 5) {
        pause = true;
        setTimeout(() => {
          direction = -1;
          pause = false;
        }, 2500);
      }

      if (window.scrollY <= 5 && direction < 0) {
        pause = true;
        setTimeout(() => {
          direction = 1;
          pause = false;
        }, 2500);
      }
    }, 40);
