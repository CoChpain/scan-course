<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCAN COURSE</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body {
  background: #000;
  color: white;
  font-family: Arial;
  text-align: center;
}

#reader {
  width: 300px;
  height: 300px;
  margin: auto;
  border: 4px solid white;
  border-radius: 12px;
  overflow: hidden;
}

#reader video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

#feedback {
  font-size: 20px;
  font-weight: bold;
  margin-top: 10px;
}

#lock {
  position: fixed;
  inset: 0;
  background: black;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}
</style>
</head>

<body>

<div id="lock">
  <h2>🔒 Accès protégé</h2>
  <input id="pwd" type="password" placeholder="Mot de passe">
  <button onclick="checkPwd()">Entrer</button>
  <div id="err"></div>
</div>

<h1>🏁 ARRIVÉES COURSE</h1>
<div id="reader"></div>
<div id="feedback"></div>

<script>
let scanner = null;

function feedback(msg, color) {
  const el = document.getElementById("feedback");
  el.innerHTML = msg;
  el.style.color = color;
}

// ✅ SCANNER CORRIGÉ
function initScanner() {
  if (scanner) {
    scanner.stop().catch(() => {});
  }

  scanner = new Html5Qrcode("reader");

  scanner.start(
    { facingMode: "environment" },
    {
      fps: 10,
      qrbox: { width: 250, height: 250 }
    },
    onScan,
    () => {}
  ).catch(err => {
    console.error(err);
    feedback("⚠️ Impossible d'accéder à la caméra", "orange");
  });
}

// ✅ SCAN
function onScan(text) {
  const dossard = text.replace(/\D/g, "");

  if (!dossard) {
    feedback("❌ QR invalide", "red");
    return;
  }

  feedback("✅ Dossard : " + dossard, "lime");
}

// 🔐 LOGIN
function checkPwd() {
  const pwd = document.getElementById("pwd").value;

  if (pwd === "3sRunTravel2026") {
    document.getElementById("lock").style.display = "none";
    initScanner();
  } else {
    document.getElementById("err").innerHTML = "❌ Mauvais mot de passe";
  }
}
</script>

</body>
</html>
