<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCAN COURSE</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      background: #000;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
      margin: 0;
      padding: 10px;
      min-height: 100vh;
    }
    h1 {
      margin: 10px 0;
      font-size: 20px;
    }
    button, input {
      padding: 10px;
      font-size: 16px;
      margin: 5px;
      border-radius: 8px;
      border: none;
    }
    button {
      background: #333;
      color: white;
    }
    input {
      width: 100%;
      max-width: 300px;
      text-align: center;
      background: #222;
      color: white;
    }
    #feedback {
      font-size: 22px;
      font-weight: bold;
      min-height: 30px;
    }
    #scanner-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 100%;
      max-width: 100%;
      margin: 0 auto;
    }
    #scanner-controls {
      width: 100%;
      max-width: 300px;
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    #reader {
      width: 100%;
      max-width: 300px;
      height: 300px;
      border-radius: 12px;
      overflow: hidden;
      border: 4px solid white;
      background: black;
      margin: 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      position: relative;
    }
    #reader video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      display: block !important;
      border-radius: 8px !important;
    }
    .html5qrcode-scanner-tool-container {
      display: none !important;
    }
    #reader .html5qrcode-scanner-tool-container,
    #reader .html5qrcode-scanner-tool,
    #reader .html5qrcode-scanner-tool-button,
    #reader .html5qrcode-scanner-tool-select,
    #reader .html5qrcode-scanner-tool-button-container {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      height: 0 !important;
      width: 0 !important;
      position: absolute !important;
      clip: rect(0 0 0 0) !important;
      z-index: -1 !important;
      pointer-events: none !important;
    }
    .scanner-button {
      font-size: 12px;
      padding: 6px 10px;
      background: #333;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    #input-zone {
      width: 100%;
      max-width: 320px;
      margin: 10px auto;
      padding: 10px;
      border-radius: 10px;
      background: #111;
    }
    #lock {
      position: fixed;
      inset: 0;
      background: black;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    @media (max-width: 600px) {
      #reader {
        max-width: 260px;
      }
    }
  </style>
</head>

<body>
  <div id="lock">
    <h2>🔒 Accès protégé</h2>
    <input id="pwd" type="password" placeholder="Mot de passe">
    <button onclick="checkPwd()">Entrer</button>
    <div id="err"></div>
  </div>

  <div id="scanner-container">
    <h1>🏁 ARRIVÉES COURSE</h1>
    <div id="scanner-controls"></div>
    <div id="reader"></div>
    <div id="feedback"></div>
  </div>
  <div id="input-zone">
    <div class="zone">
      <input id="arrivee-manuel" placeholder="Dossard arrivée">
      <button id="btn-arrivee">✅ ARRIVÉE</button>
    </div>

    <div class="zone">
      <button id="btn-reset-cache" style="background: red;">🔄 Réinitialiser le cache</button>
    </div>
  </div>

  <script>
    const SESSION_DURATION = 30 * 60 * 1000;
    window.checkPwd = function() {
      const password = document.getElementById("pwd").value;
      if(password === "3sRunTravel2026") {
        localStorage.setItem("scanAuthTime", Date.now());
        unlock();
      } else {
        document.getElementById("err").innerHTML = "❌ Mot de passe incorrect";
      }
    };

    function unlock() {
      document.getElementById("lock").style.display = "none";
      initScanner();
    }

    function checkSession() {
      const saved = localStorage.getItem("scanAuthTime");
      if(saved && (Date.now() - saved) < SESSION_DURATION) unlock();
    }
    checkSession();
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
    import {
      getFirestore, collection, query, where, getDocs, addDoc, updateDoc,
      doc, serverTimestamp, onSnapshot, getDoc, setDoc, runTransaction, enableIndexedDbPersistence, deleteDoc
    } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";
    import { firebaseConfig } from "./firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    enableIndexedDbPersistence(db)
      .catch((err) => {
        if (err.code == 'failed-precondition') {
          console.log("Persistance désactivée : plusieurs onglets ouverts.");
        }
      });

    // ======================
    // 💾 Cache global partagé
    // ======================
    const GLOBAL_CACHE_KEY = "apolloRunGlobalCache";
    let globalCache = {
      locks: {},
      scans: {},
      coureurs: {},
      limites: { t1:40, t2:37, t3:34, t4:31, t5:28, t6:25, t7:22, t8:19, t9:16, t10:13 },
      startMs: null,
      lastUpdated: 0
    };

    const cacheChannel = new BroadcastChannel('apollo-run-cache');

    function loadGlobalCache() {
      const saved = localStorage.getItem(GLOBAL_CACHE_KEY);
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          globalCache = { ...globalCache, ...parsed };
        } catch (e) {
          console.error("Erreur chargement cache global :", e);
        }
      }
    }

    function saveGlobalCache() {
      localStorage.setItem(GLOBAL_CACHE_KEY, JSON.stringify(globalCache));
      cacheChannel.postMessage({ type: 'cache-updated', data: globalCache });
    }

    async function updateGlobalCache() {
      const now = Date.now();
      if (now - globalCache.lastUpdated < 15000) return;

      try {
        const limitesDoc = await getDoc(doc(db, "course", "limitesTours"));
        if (limitesDoc.exists()) {
          globalCache.limites = limitesDoc.data();
        }

        const departDoc = await getDoc(doc(db, "course", "depart"));
        if (departDoc.exists()) {
          globalCache.startMs = departDoc.data().startMs;
        }

        const coureursSnap = await getDocs(collection(db, "coureurs"));
        globalCache.coureurs = {};
        coureursSnap.forEach(docSnap => {
          const data = docSnap.data();
          if (data.dossard !== undefined && data.dossard !== null) {
            globalCache.coureurs[data.dossard] = {
              ...data,
              _docId: docSnap.id
            };
          }
        });

        const currentTour = calculateCurrentTour(globalCache.startMs, globalCache.limites);
        if (currentTour > 0) {
          const locksSnap = await getDocs(query(collection(db, "scansLocks"), where("tour", "==", currentTour)));
          locksSnap.forEach(doc => {
            const data = doc.data();
            globalCache.locks[`${data.dossard}_t${data.tour}`] = true;
          });

          const scansSnap = await getDocs(query(collection(db, "resultats"), where("tour", "==", currentTour)));
          scansSnap.forEach(doc => {
            const data = doc.data();
            globalCache.scans[`${data.dossard}_t${data.tour}`] = data;
          });
        }

        globalCache.lastUpdated = now;
        saveGlobalCache();
      } catch (error) {
        console.error("Erreur mise à jour cache global :", error);
      }
    }

    function calculateCurrentTour(startMs, limites) {
      if (!startMs || !limites) return 0;
      const elapsedMin = (Date.now() - startMs) / 60000;
      let cumul = 0;
      for (let i = 1; i <= 10; i++) {
        const limite = limites[`t${i}`];
        if (limite === undefined) break;
        cumul += limite;
        if (elapsedMin <= cumul) return i;
      }
      return 10;
    }

    // ======================
    // 🔊 Bips sonores
    // ======================
    const beepSuccess = new Audio("https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg"); // ✅ Coureur dans les délais
    const beepEliminated = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg"); // 🚨 Coureur hors délai/éliminé
    const beepDuplicate = new Audio("https://actions.google.com/sounds/v1/alarms/buzzer.ogg"); // ⛔ Coureur déjà scanné
    const beepError = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg"); // ❌ Erreur générale

    let scanner = null;
    let startMs = null;
    let limites = {};
    let currentTour = 0;
    let lastTourStartTime = null;
    let runnerStatuses = {};
    let processing = false;

    cacheChannel.onmessage = (e) => {
      if (e.data.type === 'cache-updated') {
        globalCache = e.data.data;
        startMs = globalCache.startMs;
        limites = globalCache.limites;
        currentTour = calculateCurrentTour(startMs, limites);
        runnerStatuses = {};
        Object.entries(globalCache.coureurs).forEach(([dossard, data]) => {
          runnerStatuses[dossard] = data.statut;
        });
        if (startMs && currentTour > 0) {
          let cumulMs = 0;
          for (let i = 1; i < currentTour; i++) {
            cumulMs += (limites[`t${i}`] || 0) * 60000;
          }
          lastTourStartTime = startMs + cumulMs;
        }
      }
    };

    window.feedback = function(message, couleur) {
      const zone = document.getElementById("feedback");
      zone.innerHTML = message;
      zone.style.color = couleur;
    };

    async function isHorsDelai(dossard, tour) {
      if (!startMs) return false;
      let cumul = 0;
      for (let i = 1; i <= tour; i++) {
        cumul += globalCache.limites[`t${i}`] || 0;
      }
      return (Date.now() - startMs) > cumul * 60000;
    }

    async function getDernierTourCommence(dossard) {
      let dernierTour = 0;

      // Vérifier dans le cache global
      for (const key in globalCache.scans) {
        if (key.startsWith(`${dossard}_t`)) {
          const tour = parseInt(key.split('_t')[1]);
          if (tour > dernierTour) dernierTour = tour;
        }
      }

      for (const key in globalCache.locks) {
        if (key.startsWith(`${dossard}_t`)) {
          const tour = parseInt(key.split('_t')[1]);
          if (tour > dernierTour) dernierTour = tour;
        }
      }

      // Si pas trouvé dans le cache, vérifier dans Firestore
      if (dernierTour === 0) {
        try {
          const scans = await getDocs(query(
            collection(db, "resultats"),
            where("dossard", "==", dossard)
          ));
          scans.forEach(doc => {
            const data = doc.data();
            if (data.tour && data.tour > dernierTour) {
              dernierTour = data.tour;
            }
          });
        } catch (e) {
          console.error("Erreur getDernierTourCommence:", e);
        }
      }

      return dernierTour;
    }

    // ======================
    // 📷 Scanner
    // ======================
    function initScanner() {
      if (scanner) {
        scanner.stop().catch(() => {});
      }

      const readerElement = document.getElementById("reader");
      const controlsContainer = document.getElementById("scanner-controls");
      controlsContainer.innerHTML = "";

      try {
        scanner = new Html5Qrcode("reader");

        const startButton = document.createElement("button");
        startButton.textContent = "📷 Démarrer";
        startButton.className = "scanner-button";
        startButton.onclick = startScanning;
        controlsContainer.appendChild(startButton);

        const stopButton = document.createElement("button");
        stopButton.textContent = "⏹️ Arrêter";
        stopButton.className = "scanner-button";
        stopButton.onclick = stopScanning;
        controlsContainer.appendChild(stopButton);

        startScanning();
      } catch (err) {
        console.error("Erreur initScanner :", err);
        feedback("⚠️ Erreur initialisation scanner", "orange");
      }
    }

    async function startScanning() {
      if (!scanner) return;

      try {
        const cameras = await Html5Qrcode.getCameras();
        if (cameras.length === 0) {
          feedback("⚠️ Aucune caméra détectée", "orange");
          return;
        }

        const backCam = cameras.find(cam =>
          cam.label.toLowerCase().includes("back") ||
          cam.label.toLowerCase().includes("environment")
        );

        const cameraId = backCam ? backCam.id : cameras[0].id;

        await scanner.start(
          { facingMode: "environment" },
          {
            fps: 5,
            qrbox: { width: 200, height: 200 },
            rememberLastUsedCamera: true,
            showTorchButtonIfSupported: false,
            disableFlip: true,
            verbose: false,
          },
          onScan,
          () => {} // Ignore toutes les erreurs de détection
        );

        feedback("📷 Scanner démarré", "lime");
      } catch (err) {
        console.error("Erreur startScanning :", err);
        feedback("⚠️ Impossible d'accéder à la caméra. Vérifiez les permissions.", "red");
        setTimeout(() => {
          feedback("💡 Astuce : Autorisez l'accès à la caméra dans les paramètres du navigateur.", "orange");
        }, 3000);
      }
    }

    function stopScanning() {
      if (scanner) {
        scanner.stop().catch(() => {});
        feedback("⏹️ Scanner arrêté", "orange");
      }
    }

    async function onScan(text) {
      const dossard = Number(text.replace(/\D/g, ""));
      if (!dossard) {
        feedback("❌ QR invalide", "red");
        beepError.play();
        return;
      }

      if (processing) return;
      processing = true;
      try {
        await traiterArrivee(dossard, "SCAN");
      } catch (e) {
        console.error("Erreur dans onScan:", e);
      } finally {
        processing = false;
      }
    }

    // ======================
    // 🏁 Traitement des arrivées (FONCTION CORRIGÉE)
    // ======================
    async function traiterArrivee(dossard, source) {
      const now = Date.now();

      // Vérifie si ce dossard a déjà été scanné récemment (3 minutes = 180000 ms)
      const lastScanRef = doc(db, "lastScans", dossard.toString());
      const lastScanSnap = await getDoc(lastScanRef);

      if (lastScanSnap.exists()) {
        const lastScanTime = lastScanSnap.data().timestamp.toMillis();
        if (now - lastScanTime < 180000) {
          feedback(`⛔ ${dossard} déjà scanné récemment`, "orange");
          beepDuplicate.play();
          return;
        }
      }

      if (!window._lastScan) {
        window._lastScan = { dossard: null, time: 0 };
      }

      if (window._lastScan.dossard === dossard && (now - window._lastScan.time) < 3000) {
        console.warn("⛔ Double scan ignoré");
        return;
      }

      window._lastScan = { dossard, time: now };

      if (!startMs) {
        feedback("⛔ Course non démarrée", "red");
        beepError.play();
        return;
      }

      if (!dossard) {
        feedback("❌ Dossard invalide", "red");
        return;
      }

      await updateGlobalCache();

      let coureur = globalCache.coureurs[dossard];
      if (!coureur) {
        const snap = await getDoc(doc(db, "coureurs", dossard));
        if (snap.exists()) {
          coureur = {
            ...snap.data(),
            _docId: snap.id
          };
          globalCache.coureurs[dossard] = coureur;
          saveGlobalCache();
        }
      }

      if (coureur && ["DNS", "DNF", "ELIMINE"].includes(coureur.statut)) {
        feedback(`⛔ ${coureur.statut}`, "red");
        beepEliminated.play();
        return;
      }

      currentTour = calculateCurrentTour(startMs, limites);

      const dernierTour = await getDernierTourCommence(dossard);
      const prochainTour = dernierTour + 1;

      if (dernierTour < currentTour - 1) {
        console.warn(`⚠️ En retard : ${dossard}`);
      }

      if (dernierTour >= prochainTour) {
        feedback(`⛔ ${dossard} a déjà validé le tour ${prochainTour}`, "orange");
        beepDuplicate.play();
        return;
      }

      if (prochainTour > currentTour) {
        feedback(`⛔ Tour ${prochainTour} non encore ouvert`, "orange");
        beepError.play();
        return;
      }

      if (dernierTour === currentTour - 1 && lastTourStartTime) {
        const timeSinceStart = Date.now() - lastTourStartTime;
        if (timeSinceStart < 180000) {
          const sec = Math.ceil((180000 - timeSinceStart) / 1000);
          feedback(`⏳ Attendre ${sec}s pour le tour ${prochainTour}`, "orange");
          beepError.play();
          return;
        }
      }

      const lockKey = `${dossard}_t${prochainTour}`;
      if (globalCache.locks[lockKey]) {
        feedback(`⛔ Déjà scanné T${prochainTour}`, "orange");
        beepDuplicate.play();
        return;
      }

      const lockRef = doc(db, "scansLocks", lockKey);
      const lockSnap = await getDoc(lockRef);

      if (lockSnap.exists()) {
        globalCache.locks[lockKey] = true;
        saveGlobalCache();
        feedback(`⛔ Déjà scanné T${prochainTour}`, "orange");
        beepDuplicate.play();
        return;
      }

      // Calculer si le coureur est hors délai
     const horsDelai = await isHorsDelai(dossard, prochainTour);

      // Créer le verrou
      await setDoc(lockRef, {
        dossard: dossard,
        tour: prochainTour,
        createdAt: serverTimestamp()
      });

      // Met à jour le dernier scan réussi pour ce dossard
      await setDoc(lastScanRef, {
        dossard: dossard,
        timestamp: serverTimestamp()
      });

      globalCache.locks[lockKey] = true;
      saveGlobalCache();

      // Enregistrer le scan avec TOUJOURS un tour explicite
      await addDoc(collection(db, "resultats"), {
        dossard: dossard,
        tour: prochainTour,  // <-- TOUJOURS inclus
        horsDelai: horsDelai,
        source: source,
        timestamp: serverTimestamp()
      });

      globalCache.scans[lockKey] = {
        dossard: dossard,
        tour: prochainTour,
        horsDelai: horsDelai,
        timestamp: Date.now()
      };
      saveGlobalCache();

      // Mettre à jour le statut du coureur
      // dans les délais -> OK / hors délai -> ELIMINE
      const nouveauStatut = horsDelai ? "ELIMINE" : "OK";

      let coureurDocId =
        coureur?._docId ||
        globalCache.coureurs[dossard]?._docId;

      // Compatibilité avec un ancien cache sans _docId
      if (!coureurDocId) {
        const q = query(
          collection(db, "coureurs"),
          where("dossard", "==", String(dossard))
        );
        const snap = await getDocs(q);
        if (!snap.empty) {
          coureurDocId = snap.docs[0].id;
        }
      }

      if (!coureurDocId) {
        console.error("Document Firestore introuvable pour", dossard);
        feedback(`❌ Impossible de mettre à jour le statut de ${dossard}`, "red");
        beepError.play();
        return;
      }

      await updateDoc(
        doc(db, "coureurs", coureurDocId),
        {
          statut: nouveauStatut,
          horsDelai: horsDelai
        }
      );

      globalCache.coureurs[dossard] = {
        ...(globalCache.coureurs[dossard] || coureur || {}),
        _docId: coureurDocId,
        statut: nouveauStatut,
        horsDelai: horsDelai
      };

      runnerStatuses[dossard] = nouveauStatut;
      saveGlobalCache();

      // Feedback visuel et sonore
      let couleur = horsDelai ? "orange" : "lime";
      if (coureur?.sexe === "F") couleur = "violet";
      if (coureur?.sexe === "H" && !horsDelai) couleur = "cyan";

      feedback(
        horsDelai
          ? `🚨 ${dossard} SCANNÉ EN RETARD (T${prochainTour}) → ÉLIMINÉ`
          : `✅ ${dossard} - TOUR ${prochainTour}`,
        couleur
      );

      if (horsDelai) {
        beepEliminated.play();
      } else {
        beepSuccess.play();
      }
    }

    // ======================
    // 🗑️ Nettoyage des anciens scans
    // ======================
    async function cleanupOldScans() {
      const oneHourAgo = new Date(Date.now() - 3600000); // 1 heure en arrière
      const lastScansSnap = await getDocs(collection(db, "lastScans"));

      lastScansSnap.forEach(async (doc) => {
        const data = doc.data();
        if (data.timestamp && data.timestamp.toDate() < oneHourAgo) {
          await deleteDoc(doc.ref);
        }
      });
    }

    // Nettoie les anciens scans toutes les 5 minutes
    setInterval(cleanupOldScans, 300000);

    // ======================
    // 📥 Initialisation
    // ======================
    window.addEventListener("DOMContentLoaded", async () => {
      loadGlobalCache();
      const lock = document.getElementById("lock");
      if (lock.style.display === "none") {
        initScanner();
      }

      const departDoc = await getDoc(doc(db, "course", "depart"));
      if (departDoc.exists()) {
        const newStartMs = departDoc.data().startMs;
        if (newStartMs && newStartMs !== globalCache.startMs) {
          globalCache.locks = {};
          globalCache.scans = {};
          globalCache.startMs = newStartMs;
          saveGlobalCache();
        }
      }

      await updateGlobalCache();
      startMs = globalCache.startMs;
      limites = globalCache.limites;
      currentTour = calculateCurrentTour(startMs, limites);
      runnerStatuses = {};
      Object.entries(globalCache.coureurs).forEach(([dossard, data]) => {
        runnerStatuses[dossard] = data.statut;
      });

      if (startMs && currentTour > 0) {
        let cumulMs = 0;
        for (let i = 1; i < currentTour; i++) {
          cumulMs += (limites[`t${i}`] || 0) * 60000;
        }
        lastTourStartTime = startMs + cumulMs;
      }

      onSnapshot(doc(db, "course", "depart"), async (snap) => {
        if (snap.exists()) {
          startMs = snap.data().startMs;
          globalCache.startMs = startMs;
          currentTour = calculateCurrentTour(startMs, limites);

          if (startMs && currentTour > 0) {
            let cumulMs = 0;
            for (let i = 1; i < currentTour; i++) {
              cumulMs += (limites[`t${i}`] || 0) * 60000;
            }
            lastTourStartTime = startMs + cumulMs;
          }

          globalCache.locks = {};
          globalCache.scans = {};
          globalCache.lastUpdated = 0;
          saveGlobalCache();
          feedback("✅ Nouvelle course démarrée", "lime");
        } else {
          startMs = null;
          currentTour = 0;
          lastTourStartTime = null;
          globalCache.startMs = null;
          globalCache.locks = {};
          globalCache.scans = {};
          saveGlobalCache();
          feedback("⚠️ Course terminée ou non démarrée", "orange");
        }
      });

      onSnapshot(doc(db, "course", "limitesTours"), snap => {
        if (snap.exists()) {
          limites = snap.data();
          globalCache.limites = limites;
          saveGlobalCache();
          currentTour = calculateCurrentTour(startMs, limites);
        }
      });

      onSnapshot(collection(db, "coureurs"), snap => {
        runnerStatuses = {};
        snap.forEach(d => {
          const data = d.data();
          if (data.dossard) {
            runnerStatuses[data.dossard] = data.statut;
            globalCache.coureurs[data.dossard] = data;
          }
        });
        saveGlobalCache();
      });

      setInterval(updateGlobalCache, 15000);
      setInterval(() => {
        if (startMs) currentTour = calculateCurrentTour(startMs, limites);
      }, 5000);

      const observer = new MutationObserver((mutations) => {
        mutations.forEach((mutation) => {
          if (mutation.attributeName === "style") {
            const lock = document.getElementById("lock");
            if (lock.style.display === "none") {
              // Supprimé pour éviter le doublon avec unlock()
            }
          }
        });
      });
      observer.observe(document.getElementById("lock"), { attributes: true });
    });

    // ======================
    // 🖥️ Boutons manuels
    // ======================
    document.getElementById("btn-arrivee").onclick = async () => {
      if (processing) return;
      processing = true;
      try {
        const dossard = Number(document.getElementById("arrivee-manuel").value.replace(/\D/g, ""));
        if (!dossard) {
          feedback("❌ Dossard invalide", "red");
          beepError.play();
          return;
        }
        await traiterArrivee(dossard, "MANUEL");
        document.getElementById("arrivee-manuel").value = "";
      } finally {
        processing = false;
      }
    };

    document.getElementById("btn-reset-cache").onclick = () => {
      globalCache = {
        locks: {},
        scans: {},
        coureurs: {},
        limites: { t1:40, t2:37, t3:34, t4:31, t5:28, t6:25, t7:22, t8:19, t9:16, t10:13 },
        startMs: null,
        lastUpdated: 0
      };
      saveGlobalCache();
      location.reload();
    };

    async function changerStatut(dossard, type) {
      await updateGlobalCache();

      let coureur = globalCache.coureurs[dossard];
      if (!coureur) {
        const coureurSnap = await getDoc(doc(db, "coureurs", dossard));
        if (coureurSnap.exists()) {
          coureur = coureurSnap.data();
          globalCache.coureurs[dossard] = coureur;
        }
      }

      if (!coureur) {
        feedback("❌ Dossard inconnu", "red");
        beepError.play();
        return;
      }

      try {
        const existingDnsDnf = await getDocs(query(
          collection(db, "resultats"),
          where("dossard", "==", dossard),
          where("type", "in", ["DNS", "DNF"])
        ));
        if (!existingDnsDnf.empty) {
          const existingData = existingDnsDnf.docs[0].data();
          feedback(`⛔ Ce coureur a déjà un statut ${existingData.type} T${existingData.tour}`, "red");
          beepError.play();
          return;
        }
      } catch (e) {
        console.error("Erreur vérification DNS/DNF:", e);
        feedback("❌ Erreur de vérification", "red");
        beepError.play();
        return;
      }

      if (["DNF", "DNS", "ELIMINE"].includes(coureur.statut)) {
        feedback(`⛔ Déjà ${coureur.statut}`, "red");
        beepError.play();
        return;
      }

      const dernierTour = await getDernierTourCommence(dossard);
      const tour = Math.min(10, dernierTour + 1);

      const q = query(collection(db, "coureurs"), where("dossard", "==", dossard));
      const snap = await getDocs(q);
      if (snap.empty) {
        feedback("❌ Dossard inconnu", "red");
        beepError.play();
        return;
      }
      const coureurDoc = snap.docs[0];

      try {
        await runTransaction(db, async (transaction) => {
          const existingRef = query(
            collection(db, "resultats"),
            where("dossard", "==", dossard),
            where("type", "in", ["DNS", "DNF"])
          );
          const existingSnap = await getDocs(existingRef);
          if (!existingSnap.empty) {
            throw new Error("DNS/DNF déjà existant");
          }

          transaction.update(doc(db, "coureurs", coureurDoc.id), { statut: type });
          const newDocRef = doc(collection(db, "resultats"));
          transaction.set(newDocRef, {
            dossard: dossard,
            type: type,
            tour: tour,
            source: "MANUEL",
            timestamp: serverTimestamp()
          });
          const lockRef = doc(db, "scansLocks", `${dossard}_t${tour}`);
          transaction.set(lockRef, {
            dossard: dossard,
            tour: tour,
            createdAt: serverTimestamp()
          });
        });

        globalCache.coureurs[dossard].statut = type;
        globalCache.locks[`${dossard}_t${tour}`] = true;
        saveGlobalCache();

        feedback(
          type === "DNF" ? `🏳️ DNF ${dossard} T${tour}` : `🚫 DNS ${dossard} T${tour}`,
          "orange"
        );
        beepError.play();
      } catch (e) {
        feedback("⛔ Erreur : " + (e.message || "Conflit détecté"), "red");
        beepError.play();
      }
    }

    window.addEventListener("beforeunload", () => {
      if (scanner) {
        scanner.stop().catch(() => {});
      }
      cacheChannel.close();
    });
  </script>
</body>
