<script>


// ======================
// AUTHENTIFICATION
// ======================


const SESSION_DURATION =
30*60*1000;




window.checkPwd=function(){


const pwd =
document.getElementById("pwd").value;



if(
pwd==="3sRunTravel2026"
){


localStorage.setItem(
"scanAuthTime",
Date.now()
);


unlock();


}

else{


document.getElementById("err").innerHTML=
"❌ Mot de passe incorrect";


}



};






function unlock(){


document
.getElementById("lock")
.style.display="none";


}





function checkSession(){


const saved =
localStorage.getItem("scanAuthTime");



if(
saved &&
Date.now()-saved < SESSION_DURATION
){


unlock();


}


}



checkSession();



</script>









<script type="module">


// ======================
// FIREBASE IMPORT
// ======================


import {

initializeApp

}

from

"https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";




import {


getFirestore,

collection,

query,

where,

getDocs,

addDoc,

updateDoc,

doc,

serverTimestamp,

onSnapshot,

getDoc,

setDoc,

runTransaction


}

from

"https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";




import {

firebaseConfig

}

from

"./firebase-config.js";







// ======================
// INITIALISATION
// ======================


const app =
initializeApp(firebaseConfig);



const db =
getFirestore(app);









// ======================
// VARIABLES COURSE
// ======================



let startMs=null;



let limites={

t1:40,
t2:37,
t3:34,
t4:31,
t5:28,
t6:25,
t7:22,
t8:19,
t9:16,
t10:13

};




let currentTour=0;


let lastTourStartTime=null;


let runnerStatuses={};





let lastScan=null;

let lastScanTime=0;

let processing=false;






// ======================
// SONS
// ======================


const beepOk =
new Audio(
"https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg"
);



const beepError =
new Audio(
"https://actions.google.com/sounds/v1/alarms/beep_short.ogg"
);









// ======================
// CALCUL TOUR ACTUEL
// ======================



function updateCurrentTour(){



if(!startMs){


currentTour=0;

lastTourStartTime=null;

return;


}



const elapsed =
(Date.now()-startMs)/60000;



let cumul=0;


let nouveauTour=0;




for(
let i=1;
i<=10;
i++
){



const limite =
limites["t"+i];



if(!limite)
break;



cumul+=limite;



if(elapsed<cumul){


nouveauTour=i;

break;


}



}





if(nouveauTour===0){


nouveauTour=
10;


}






if(nouveauTour!==currentTour){



let debut=0;



for(
let i=1;
i<nouveauTour;
i++
){


debut +=
(limites["t"+i]||0)
*60000;


}



lastTourStartTime =
startMs+debut;



currentTour=
nouveauTour;



}



}









// ======================
// HORS DELAI
// ======================



async function isHorsDelai(
dossard,
tour
){



let cumul=0;



for(
let i=1;
i<=tour;
i++
){


cumul +=
limites["t"+i]||0;


}




return (

Date.now()-startMs >

cumul*60000

);



}









// ======================
// LISTENER DEPART
// ======================



onSnapshot(

doc(
db,
"course",
"depart"
),

snap=>{


if(
snap.exists()
){


startMs =
snap.data().startMs;


updateCurrentTour();



}

else{


startMs=null;

currentTour=0;


}


}

);








// ======================
// LISTENER LIMITES
// ======================



onSnapshot(

doc(
db,
"course",
"limitesTours"
),

snap=>{


if(
snap.exists()
){


limites =
snap.data();


updateCurrentTour();


}


}

);








// ======================
// LISTENER COUREURS
// ======================


onSnapshot(

collection(
db,
"coureurs"
),

snap=>{


runnerStatuses={};



snap.forEach(

d=>{


const data =
d.data();



if(data.dossard){


runnerStatuses[data.dossard]
=
data.statut;


}


}


);


}

);

  // =======================================
// 🏁 TRAITEMENT ARRIVEE
// VERROU COMMUN ADMINTEST / SCAN
// =======================================


async function traiterArrivee(dossard, source){


    if(!startMs){

        feedback(
            "⛔ Course non démarrée",
            "red"
        );

        beepError.play();
        return;

    }



    if(!dossard){

        feedback(
            "❌ Dossard invalide",
            "red"
        );

        return;

    }




    // ===============================
    // RECHERCHE DU COUREUR
    // ===============================


    const snap = await getDocs(
        query(
            collection(db,"coureurs"),
            where(
                "dossard",
                "==",
                dossard
            )
        )
    );



    if(snap.empty){

        feedback(
            "❌ Dossard inconnu",
            "red"
        );

        beepError.play();

        return;

    }



    const coureurDoc = snap.docs[0];

    const coureur = coureurDoc.data();





    // ===============================
    // BLOCAGE STATUT
    // ===============================


    if(
        [
            "DNS",
            "DNF",
            "ELIMINE"
        ].includes(coureur.statut)
    ){


        feedback(
            `⛔ ${coureur.statut} impossible`,
            "red"
        );

        beepError.play();

        return;

    }







    // ===============================
    // CALCUL DU PROCHAIN TOUR
    // ===============================


    const toursSnap = await getDocs(
        query(
            collection(db,"resultats"),
            where(
                "dossard",
                "==",
                dossard
            )
        )
    );



    let prochainTour = 1;



    toursSnap.forEach(r=>{


        const data=r.data();


        if(
            data.tour &&
            data.tour >= prochainTour
        ){

            prochainTour =
            data.tour + 1;

        }


    });






    // Tour pas encore ouvert

    if(prochainTour > currentTour){


        feedback(
            `⛔ Tour ${prochainTour} non ouvert`,
            "orange"
        );


        beepError.play();

        return;

    }







    // ===================================
    // 🔒 VERROU FIRESTORE ATOMIQUE COMMUN
    // ===================================


    const lockId =
    `${dossard}_tour_${prochainTour}`;



    const lockRef =
    doc(
        db,
        "scansLocks",
        lockId
    );





    try{


        await runTransaction(
            db,
            async(transaction)=>{


                const lockSnap =
                await transaction.get(lockRef);



                // Déjà pris par AdminTest ou un autre scanner

                if(lockSnap.exists()){


                    throw new Error(
                        "DEJA_SCANNÉ"
                    );


                }





                // Création du verrou

                transaction.set(
                    lockRef,
                    {

                        dossard:dossard,

                        tour:prochainTour,

                        source:source,

                        date:
                        serverTimestamp()

                    }
                );


            }
        );


    }

    catch(e){


        feedback(
            "⛔ Déjà enregistré sur un autre poste",
            "orange"
        );


        beepError.play();


        return;


    }









    // ===============================
    // VERIFICATION HORS DELAI
    // ===============================


    const horsDelai =
    await isHorsDelai(
        dossard,
        prochainTour
    );





    if(horsDelai){


        await addDoc(
            collection(db,"resultats"),
            {

                dossard,

                tour:prochainTour,

                horsDelai:true,

                source,

                timestamp:
                serverTimestamp()

            }
        );



        await updateDoc(
            doc(
                db,
                "coureurs",
                coureurDoc.id
            ),
            {

                statut:"ELIMINE"

            }
        );



        feedback(
            `🚨 ${dossard} HORS DELAI - ELIMINE`,
            "red"
        );



        beepError.play();


        return;

    }








    // ===============================
    // ENREGISTREMENT NORMAL
    // ===============================



    await addDoc(
        collection(db,"resultats"),
        {

            dossard,

            tour:prochainTour,

            horsDelai:false,

            source,

            timestamp:
            serverTimestamp()

        }
    );






    // ===============================
    // AFFICHAGE COULEUR
    // ===============================


    let couleur="lime";



    const sexe =
    (
        coureur.sexe ||
        coureur.categorie ||
        ""
    )
    .toUpperCase();




    if(sexe==="F"){

        couleur="violet";

    }


    if(sexe==="H"){

        couleur="cyan";

    }






    feedback(
        `✅ Dossard ${dossard} - Tour ${prochainTour}`,
        couleur
    );



    beepOk.play();



}

// =======================================
// 📷 SCANNER QR CODE
// =======================================


const scanner =
new Html5QrcodeScanner(
    "reader",
    {
        fps:10,
        qrbox:220
    }
);



scanner.render(

async(text)=>{


    if(!startMs){

        feedback(
            "⛔ Course non démarrée",
            "orange"
        );

        return;

    }



    // Extraction du numéro de dossard

    const dossard =
    text
    .split("-")
    .pop()
    .replace(/\D/g,"");



    if(!dossard){

        feedback(
            "❌ QR invalide",
            "red"
        );

        return;

    }





    const now = Date.now();



    // Anti lecture multiple caméra

    if(
        dossard===lastScan &&
        now-lastScanTime<3000
    ){

        return;

    }




    if(processing){

        return;

    }



    lastScan=dossard;

    lastScanTime=now;

    processing=true;




    try{


        await traiterArrivee(
            dossard,
            "SCAN"
        );


    }

    finally{


        setTimeout(()=>{

            processing=false;

        },1500);


    }



}

);









// =======================================
// 🔘 ARRIVÉE MANUELLE
// =======================================


document
.getElementById("btn-arrivee")
.onclick=
async()=>{


    const dossard =
    document
    .getElementById("arrivee-manuel")
    .value
    .replace(/\D/g,"");



    await traiterArrivee(
        dossard,
        "MANUEL"
    );


};









// =======================================
// 🏳️ DNF
// =======================================


document
.getElementById("btn-dnf")
.onclick=
async()=>{


    const dossard =
    document
    .getElementById("dossard-dnf")
    .value
    .replace(/\D/g,"");



    if(!dossard){

        feedback(
            "❌ Dossard invalide",
            "red"
        );

        return;

    }





    const snap =
    await getDocs(
        query(
            collection(db,"coureurs"),
            where(
                "dossard",
                "==",
                dossard
            )
        )
    );



    if(snap.empty){

        feedback(
            "❌ Dossard inconnu",
            "red"
        );

        return;

    }



    const coureurDoc =
    snap.docs[0];



    const coureur =
    coureurDoc.data();





    if(
        [
            "DNF",
            "DNS",
            "ELIMINE"
        ]
        .includes(coureur.statut)
    ){

        feedback(
            `⛔ Déjà ${coureur.statut}`,
            "red"
        );

        return;

    }






    // verrou DNF

    const lockRef =
    doc(
        db,
        "scansLocks",
        `${dossard}_DNF`
    );



    const lockSnap =
    await getDoc(lockRef);



    if(lockSnap.exists()){


        feedback(
            "⛔ DNF déjà enregistré",
            "orange"
        );


        return;


    }




    await setDoc(
        lockRef,
        {

            dossard,

            type:"DNF",

            source:"MANUEL",

            createdAt:
            serverTimestamp()

        }
    );







    await updateDoc(
        doc(
            db,
            "coureurs",
            coureurDoc.id
        ),
        {

            statut:"DNF"

        }
    );






    await addDoc(
        collection(db,"resultats"),
        {

            dossard,

            type:"DNF",

            source:"MANUEL",

            timestamp:
            serverTimestamp()

        }
    );




    beepError.play();


    feedback(
        `🏳️ DNF ${dossard}`,
        "orange"
    );


};

// =======================================
// 💬 AFFICHAGE MESSAGE
// =======================================


function feedback(message,couleur){


    const zone =
    document.getElementById("feedback");



    zone.innerHTML =
    message;



    zone.style.color =
    couleur;



}
