<script>

const SESSION_DURATION =
30*60*1000;


function checkPwd(){

if(
document.getElementById("pwd").value
==="3sRunTravel2026"
){

localStorage.setItem(
"scanAuthTime",
Date.now()
);

unlock();

}
else{

document.getElementById("err").innerText=
"Mot de passe incorrect";

}

}



function unlock(){

document.getElementById("lock")
.style.display="none";

}

const saved=
localStorage.getItem("scanAuthTime");


if(saved &&
Date.now()-saved < SESSION_DURATION){

<script type="module">


import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";


import {

getFirestore,
collection,
query,
where,
getDocs,
addDoc,
updateDoc,
doc,
serverTimestamp,
onSnapshot,
getDoc,
setDoc

}
from
"https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";


import {
firebaseConfig
}
from "./firebase-config.js";



const app =
initializeApp(firebaseConfig);


const db =
getFirestore(app);





// ======================
// VARIABLES
// ======================


let startMs=null;


let limites={

t1:40,
t2:37,
t3:34,
t4:31,
t5:28,
t6:25,
t7:22,
t8:19,
t9:16,
t10:13

};


let currentTour=0;


let lastTourStartTime=null;


let runnerStatuses={};




const beepOk =
new Audio(
"https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg"
);


const beepError =
new Audio(
"https://actions.google.com/sounds/v1/alarms/beep_short.ogg"
);




let lastScan=null;

let lastScanTime=0;

let processing=false;





// ======================
// TOUR ACTUEL
// ======================


function updateCurrentTour(){


if(!startMs){

currentTour=0;

lastTourStartTime=null;

return;

}



const elapsedMs=
Date.now()-startMs;


const diffMin=
elapsedMs/60000;



let cumul=0;

let newTour=0;



for(let i=1;i<=10;i++){


const limite=
limites["t"+i];


if(!limite)
break;


cumul+=limite;



if(diffMin<cumul){

newTour=i;

break;

}

}




if(newTour===0){

newTour=
Math.max(
...Object.keys(limites)
.map(
k=>parseInt(
k.replace("t","")
)
)
);

}




if(newTour!==currentTour){


let cumulMs=0;



for(let i=1;i<newTour;i++){

cumulMs+=
(limites["t"+i]||0)
*60000;

}



lastTourStartTime =
startMs+cumulMs;



currentTour=newTour;


}



}






// ======================
// HORS DELAI
// ======================


async function isHorsDelai(
dossard,
tour
){


if(
!startMs ||
tour<1 ||
tour>10
)
return false;



let cumul=0;


for(let i=1;i<=tour;i++){

cumul+=
limites["t"+i]||0;

}



return (
Date.now()-startMs >
cumul*60000
);


}




// ======================
// VERROU COMMUN ADMIN/SCAN
// ======================


async function isScanLocked(
dossard,
tour
){


const lockRef =
doc(
db,
"scansLocks",
`${dossard}_t${tour}`
);



const snap =
await getDoc(lockRef);



return snap.exists();


}





// ======================
// FIREBASE LISTENERS
// ======================



onSnapshot(
doc(db,"course","depart"),
snap=>{


if(snap.exists()){


startMs =
snap.data().startMs;


updateCurrentTour();


}
else{


startMs=null;

currentTour=0;

lastTourStartTime=null;


}


});




onSnapshot(
doc(db,"course","limitesTours"),
snap=>{


if(snap.exists()){

limites=snap.data();

updateCurrentTour();

}


});





onSnapshot(
collection(db,"coureurs"),
snap=>{


runnerStatuses={};



snap.forEach(d=>{


const data=d.data();


if(data.dossard){

runnerStatuses[data.dossard]
=data.statut;

}



});


});

// ======================
// 📷 SCANNER QR CODE
// ======================


const scanner =
new Html5QrcodeScanner(
"reader",
{
fps:10,
qrbox:220
}
);



scanner.render(

async(text)=>{


if(!startMs){

feedback(
"⛔ Course non démarrée",
"orange"
);

return;

}



const dossard =
text
.split("-")
.pop()
.replace(/\D/g,"");



const now =
Date.now();



// anti répétition QR
if(
dossard===lastScan &&
now-lastScanTime<3000
){

return;

}



if(processing){

return;

}



lastScan=dossard;

lastScanTime=now;

processing=true;



try{


await traiterArrivee(
dossard,
"SCAN"
);



}

finally{


setTimeout(()=>{

processing=false;

},1500);



}



}

);






// ======================
// 🔘 ARRIVÉE MANUELLE
// ======================


document
.getElementById("btn-arrivee")
.onclick=()=>{


const dossard =
document
.getElementById("arrivee-manuel")
.value
.replace(/\D/g,"");



traiterArrivee(
dossard,
"MANUEL"
);


};








// ======================
// 🏳️ DNF
// ======================


document
.getElementById("btn-dnf")
.onclick=
async()=>{


if(!startMs){

feedback(
"⛔ Impossible DNF avant départ",
"red"
);

beepError.play();

return;

}



const dossard =
document
.getElementById("dossard-dnf")
.value
.replace(/\D/g,"");



if(!dossard){

feedback(
"❌ Dossard invalide",
"red"
);

return;

}




const snap =
await getDocs(
query(
collection(db,"coureurs"),
where("dossard","==",dossard)
)
);



if(snap.empty){

feedback(
"❌ Dossard inconnu",
"red"
);

return;

}



const coureurDoc =
snap.docs[0];


const coureur =
coureurDoc.data();





if(
[
"DNF",
"DNS",
"ELIMINE"
]
.includes(coureur.statut)
){


feedback(
`⛔ Déjà ${coureur.statut}`,
"red"
);

return;


}






// verrou DNF

const lock =
doc(
db,
"scansLocks",
`${dossard}_DNF`
);



await setDoc(
lock,
{

dossard,

type:"DNF",

createdAt:serverTimestamp()

}
);





await updateDoc(
doc(
db,
"coureurs",
coureurDoc.id
),
{

statut:"DNF"

}
);



runnerStatuses[dossard]="DNF";





await addDoc(
collection(db,"resultats"),
{

dossard,

timestamp:serverTimestamp(),

type:"DNF",

source:"MANUEL"

}
);





beepError.play();


feedback(
`🏳️ DNF ${dossard}`,
"orange"
);



};
