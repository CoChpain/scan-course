<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCAN COURSE</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      background: #000;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
      margin: 0;
      padding: 10px;
      min-height: 100vh;
    }

    h1 {
      margin: 10px 0;
      font-size: 20px;
    }

    button, input {
      padding: 10px;
      font-size: 16px;
      margin: 5px;
      border-radius: 8px;
      border: none;
    }

    button {
      background: #333;
      color: white;
    }

    input {
      width: 100%;
      max-width: 300px;
      text-align: center;
      background: #222;
      color: white;
    }

    #feedback {
      font-size: 22px;
      font-weight: bold;
      min-height: 30px;
    }

    /* SCANNER */
    #scanner-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    #reader {
      width: 100%;
      max-width: 320px;
      aspect-ratio: 1/1;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #444;
      background: black;
    }

    /* INPUT ZONE */
    #input-zone {
      width: 100%;
      max-width: 320px;
      margin: 10px auto;
      padding: 10px;
      border-radius: 10px;
      background: #111;
    }

    /* LOCK */
    #lock {
      position: fixed;
      inset: 0;
      background: black;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    /* MOBILE */
    @media (max-width: 600px) {
      #reader {
        max-width: 260px;
      }
    }
  </style>
</head>

<body>
  <div id="lock">
    <h2>🔒 Accès protégé</h2>
    <input id="pwd" type="password" placeholder="Mot de passe">
    <button onclick="checkPwd()">Entrer</button>
    <div id="err"></div>
  </div>

  <div id="scanner-container">
    <h1>🏁 ARRIVÉES COURSE</h1>
    <div id="reader"></div>
    <div id="feedback"></div>
  </div>

  <div id="input-zone">
    <div class="zone">
      <input id="arrivee-manuel" placeholder="Dossard arrivée">
      <button id="btn-arrivee">✅ ARRIVÉE</button>
    </div>

    <div class="zone">
      <input id="dossard-dnf" placeholder="Dossard DNF">
      <button id="btn-dnf">🏳️ DNF</button>
    </div>

    <div class="zone">
      <input id="dossard-dns" placeholder="Dossard DNS">
      <button id="btn-dns">🚫 DNS</button>
    </div>
  </div>

  <script>
    // AUTHENTIFICATION LOCALE
    const SESSION_DURATION = 30 * 60 * 1000;

    window.checkPwd = function() {
      const password = document.getElementById("pwd").value;
      if(password === "3sRunTravel2026") {
        localStorage.setItem("scanAuthTime", Date.now());
        unlock();
      } else {
        document.getElementById("err").innerHTML = "❌ Mot de passe incorrect";
      }
    };

    function unlock() {
      document.getElementById("lock").style.display = "none";
    }

    function checkSession() {
      const saved = localStorage.getItem("scanAuthTime");
      if(saved && (Date.now() - saved) < SESSION_DURATION) unlock();
    }
    checkSession();
  </script>

  <script type="module">
    // FIREBASE IMPORT
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
    import {
      getFirestore, collection, query, where, getDocs, addDoc, updateDoc,
      doc, serverTimestamp, onSnapshot, getDoc, setDoc, runTransaction, enableIndexedDbPersistence
    } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";
    import { firebaseConfig } from "./firebase-config.js";

    // INITIALISATION FIREBASE
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    enableIndexedDbPersistence(db)
      .catch((err) => {
        if (err.code == 'failed-precondition') {
          console.log("Persistance désactivée : plusieurs onglets ouverts.");
        }
      });

    // ======================
    // 💾 Cache global partagé
    // ======================
    const GLOBAL_CACHE_KEY = "apolloRunGlobalCache";
    let globalCache = {
      locks: {},
      scans: {},
      coureurs: {},
      limites: { t1:40, t2:37, t3:34, t4:31, t5:28, t6:25, t7:22, t8:19, t9:16, t10:13 },
      startMs: null,
      lastUpdated: 0
    };

    // BroadcastChannel pour synchroniser entre onglets
    const cacheChannel = new BroadcastChannel('apollo-run-cache');

    // Charge le cache global
    function loadGlobalCache() {
      const saved = localStorage.getItem(GLOBAL_CACHE_KEY);
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          globalCache = { ...globalCache, ...parsed };
        } catch (e) {
          console.error("Erreur chargement cache global :", e);
        }
      }
    }

    // Sauvegarde le cache global
    function saveGlobalCache() {
      localStorage.setItem(GLOBAL_CACHE_KEY, JSON.stringify(globalCache));
      cacheChannel.postMessage({ type: 'cache-updated', data: globalCache });
    }

    // Met à jour le cache global depuis Firebase
    async function updateGlobalCache() {
      const now = Date.now();
      if (now - globalCache.lastUpdated < 30000) return; // 30 secondes

      try {
        // Charger les limites (1 lecture)
        const limitesDoc = await getDoc(doc(db, "course", "limitesTours"));
        if (limitesDoc.exists()) {
          globalCache.limites = limitesDoc.data();
        }

        // Charger le départ (1 lecture)
        const departDoc = await getDoc(doc(db, "course", "depart"));
        if (departDoc.exists()) {
          globalCache.startMs = departDoc.data().startMs;
        }

        // Charger les coureurs (1 lecture)
        const coureursSnap = await getDocs(collection(db, "coureurs"));
        globalCache.coureurs = {};
        coureursSnap.forEach(doc => {
          const data = doc.data();
          if (data.dossard) {
            globalCache.coureurs[data.dossard] = data;
          }
        });

        // Charger les verrous et scans pour le tour actuel (2 lectures)
        const currentTour = calculateCurrentTour(globalCache.startMs, globalCache.limites);
        if (currentTour > 0) {
          const locksSnap = await getDocs(query(collection(db, "scansLocks"), where("tour", "==", currentTour)));
          locksSnap.forEach(doc => {
            const data = doc.data();
            globalCache.locks[`${data.dossard}_t${data.tour}`] = true;
          });

          const scansSnap = await getDocs(query(collection(db, "resultats"), where("tour", "==", currentTour)));
          scansSnap.forEach(doc => {
            const data = doc.data();
            globalCache.scans[`${data.dossard}_t${data.tour}`] = data;
          });
        }

        globalCache.lastUpdated = now;
        saveGlobalCache();
      } catch (error) {
        console.error("Erreur mise à jour cache global :", error);
      }
    }

    // Calcule le tour actuel
    function calculateCurrentTour(startMs, limites) {
      if (!startMs || !limites) return 0;
      const elapsedMin = (Date.now() - startMs) / 60000;
      let cumul = 0;
      for (let i = 1; i <= 10; i++) {
        const limite = limites[`t${i}`];
        if (limite === undefined) break;
        cumul += limite;
        if (elapsedMin <= cumul) return i;
      }
      return 10;
    }

    // VARIABLES COURSE
    let scanner;
    let startMs = null;
    let limites = {};
    let currentTour = 0;
    let lastTourStartTime = null;
    let runnerStatuses = {};
    let lastScan = null;
    let lastScanTime = 0;
    let processing = false;

    // Écoute des mises à jour du cache via BroadcastChannel
    cacheChannel.onmessage = (e) => {
      if (e.data.type === 'cache-updated') {
        globalCache = e.data.data;
        startMs = globalCache.startMs;
        limites = globalCache.limites;
        currentTour = calculateCurrentTour(startMs, limites);
        runnerStatuses = {};
        Object.entries(globalCache.coureurs).forEach(([dossard, data]) => {
          runnerStatuses[dossard] = data.statut;
        });
        if (startMs && currentTour > 0) {
          let cumulMs = 0;
          for (let i = 1; i < currentTour; i++) {
            cumulMs += (limites[`t${i}`] || 0) * 60000;
          }
          lastTourStartTime = startMs + cumulMs;
        }
      }
    };

    // SONS
    const beepOk = new Audio("https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg");
    const beepError = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");

    // AFFICHAGE MESSAGE
    window.feedback = function(message, couleur) {
      const zone = document.getElementById("feedback");
      zone.innerHTML = message;
      zone.style.color = couleur;
    };

    // VERIFICATION HORS DELAI
    async function isHorsDelai(tour) {
      if (!startMs) return false;
      let cumul = 0;
      for (let i = 1; i <= tour; i++) {
        cumul += globalCache.limites[`t${i}`] || 0;
      }
      return (Date.now() - startMs) > cumul * 60000;
    }

    // TRAITEMENT ARRIVEE
    async function traiterArrivee(dossard, source) {
      if (!startMs) {
        feedback("⛔ Course non démarrée", "red");
        beepError.play();
        return;
      }

      if (!dossard) {
        feedback("❌ Dossard invalide", "red");
        return;
      }

      // 1. Vérifiez le statut du coureur
      const coureur = globalCache.coureurs[dossard];
      if (coureur && ["DNS", "DNF", "ELIMINE"].includes(coureur.statut)) {
        feedback(`⛔ ${coureur.statut}`, "red");
        beepError.play();
        return;
      }

      // 2. Recalculez le tour actuel
      currentTour = calculateCurrentTour(startMs, limites);

      // 3. Trouvez le dernier tour scanné
      let dernierTour = 0;
      for (const key in globalCache.scans) {
        if (key.startsWith(`${dossard}_t`)) {
          const tour = parseInt(key.split("_t")[1]);
          if (tour > dernierTour) dernierTour = tour;
        }
      }
      for (const key in globalCache.locks) {
        if (key.startsWith(`${dossard}_t`)) {
          const tour = parseInt(key.split("_t")[1]);
          if (tour > dernierTour) dernierTour = tour;
        }
      }
      const prochainTour = dernierTour + 1;

      // 4. Vérifiez si le tour est valide
      if (prochainTour > currentTour) {
        feedback(`⛔ Tour ${prochainTour} non encore ouvert (tour actuel: ${currentTour})`, "orange");
        beepError.play();
        return;
      }

      // 5. Vérifiez le délai de 3 minutes si dernier scan = tour précédent
      if (dernierTour === currentTour - 1 && lastTourStartTime) {
        const timeSinceStart = Date.now() - lastTourStartTime;
        if (timeSinceStart < 180000) {
          const remainingSeconds = Math.ceil((180000 - timeSinceStart) / 1000);
          feedback(`⏳ Attendez ${remainingSeconds}s pour le tour ${prochainTour}`, "orange");
          beepError.play();
          return;
        }
      }

      // 6. Vérifiez le verrou dans le cache global
      const lockKey = `${dossard}_t${prochainTour}`;
      if (globalCache.locks[lockKey]) {
        feedback(`⛔ Déjà scanné pour le tour ${prochainTour}`, "orange");
        beepError.play();
        return;
      }

      // 7. Vérifiez le verrou dans Firebase (1 lecture)
      const lockRef = doc(db, "scansLocks", lockKey);
      const lockSnap = await getDoc(lockRef);
      if (lockSnap.exists()) {
        globalCache.locks[lockKey] = true;
        saveGlobalCache();
        feedback(`⛔ Déjà scanné pour le tour ${prochainTour}`, "orange");
        beepError.play();
        return;
      }

      // 8. Créez le verrou dans Firebase (1 écriture)
      try {
        await runTransaction(db, async(transaction) => {
          const lock = await transaction.get(lockRef);
          if(lock.exists()) throw new Error("LOCK");
          transaction.set(lockRef, {
            dossard, tour: prochainTour, source, createdAt: serverTimestamp()
          });
        });
      } catch(e) {
        globalCache.locks[lockKey] = true;
        saveGlobalCache();
        feedback("⛔ Déjà enregistré", "orange");
        return;
      }

      // 9. Mettez à jour le cache local
      globalCache.locks[lockKey] = true;
      saveGlobalCache();

      // 10. Vérifiez hors délai
      const horsDelai = await isHorsDelai(prochainTour);
      if (horsDelai) {
        await addDoc(collection(db, "resultats"), {
          dossard, tour: prochainTour, horsDelai: true, source, timestamp: serverTimestamp()
        });
        globalCache.scans[lockKey] = { dossard, tour: prochainTour, horsDelai: true };
        saveGlobalCache();

        // Marquez le coureur comme ELIMINE
        if (coureur && !["DNF", "DNS", "ELIMINE"].includes(coureur.statut)) {
          const coureurRef = doc(db, "coureurs", Object.keys(globalCache.coureurs).find(id => globalCache.coureurs[id].dossard == dossard));
          if (coureurRef) {
            await updateDoc(coureurRef, { statut: "ELIMINE" });
            globalCache.coureurs[dossard].statut = "ELIMINE";
            saveGlobalCache();
          }
        }

        feedback(`🚨 ${dossard} HORS DELAI`, "red");
        beepError.play();
        return;
      }

      // 11. Enregistrez le scan (1 écriture)
      await addDoc(collection(db, "resultats"), {
        dossard, tour: prochainTour, horsDelai: false, source, timestamp: serverTimestamp()
      });
      globalCache.scans[lockKey] = { dossard, tour: prochainTour, horsDelai: false };
      saveGlobalCache();

      // 12. Feedback
      let couleur = "lime";
      if (coureur && coureur.sexe === "F") couleur = "violet";
      if (coureur && coureur.sexe === "H") couleur = "cyan";
      feedback(`✅ ${dossard} - TOUR ${prochainTour}`, couleur);
      beepOk.play();
    }

    // SCANNER QR
    function initScanner() {
      if (scanner) {
        scanner.clear();
      }

      const readerElement = document.getElementById("reader");
      const size = readerElement.offsetWidth;

      scanner = new Html5QrcodeScanner("reader", {
        fps: 10,
        qrbox: {
          width: size * 0.7,
          height: size * 0.7
        },
        aspectRatio: 1,
        rememberLastUsedCamera: true,
        showTorchButtonIfSupported: true
      });

      Html5Qrcode.getCameras().then(devices => {
        const backCam = devices.find(d => d.label.toLowerCase().includes("back"));
        if (backCam) {
          scanner.render(onScan, null, backCam.id);
        } else {
          scanner.render(onScan);
        }
      });
    }

    async function onScan(text) {
      const dossard = Number(text.replace(/\D/g, ""));
      if (!dossard) {
        feedback("❌ QR invalide", "red");
        beepError.play();
        return;
      }

      const now = Date.now();
      if (dossard === lastScan && now - lastScanTime < 3000) return;
      if (processing) return;

      lastScan = dossard;
      lastScanTime = now;
      processing = true;

      try {
        await traiterArrivee(dossard, "SCAN");
      } finally {
        setTimeout(() => { processing = false; }, 1500);
      }
    }

    // Initialiser le scanner après déverrouillage
    window.addEventListener("DOMContentLoaded", () => {
      // Charge le cache global
      loadGlobalCache();

      // Met à jour le cache depuis Firebase
      updateGlobalCache().then(() => {
        // Initialise les variables globales
        startMs = globalCache.startMs;
        limites = globalCache.limites;
        currentTour = calculateCurrentTour(startMs, limites);
        runnerStatuses = {};
        Object.entries(globalCache.coureurs).forEach(([dossard, data]) => {
          runnerStatuses[dossard] = data.statut;
        });

        // Calcule lastTourStartTime si nécessaire
        if (startMs && currentTour > 0) {
          let cumulMs = 0;
          for (let i = 1; i < currentTour; i++) {
            cumulMs += (limites[`t${i}`] || 0) * 60000;
          }
          lastTourStartTime = startMs + cumulMs;
        }

        // Écoute des changements en temps réel
        onSnapshot(doc(db, "course", "depart"), async (snap) => {
          if (snap.exists()) {
            startMs = snap.data().startMs;
            globalCache.startMs = startMs;
            currentTour = calculateCurrentTour(startMs, limites);
            if (currentTour > 0) {
              let cumulMs = 0;
              for (let i = 1; i < currentTour; i++) {
                cumulMs += (limites[`t${i}`] || 0) * 60000;
              }
              lastTourStartTime = startMs + cumulMs;
            }
            globalCache.startMs = startMs;
            saveGlobalCache();
            feedback("✅ Nouvelle course démarrée", "lime");
          } else {
            startMs = null;
            currentTour = 0;
            lastTourStartTime = null;
            globalCache.startMs = null;
            saveGlobalCache();
            feedback("⚠️ Course terminée ou non démarrée", "orange");
          }
        });

        onSnapshot(doc(db, "course", "limitesTours"), snap => {
          if (snap.exists()) {
            limites = snap.data();
            globalCache.limites = limites;
            saveGlobalCache();
            currentTour = calculateCurrentTour(startMs, limites);
          }
        });

        onSnapshot(collection(db, "coureurs"), snap => {
          runnerStatuses = {};
          snap.forEach(d => {
            const data = d.data();
            if (data.dossard) {
              runnerStatuses[data.dossard] = data.statut;
              globalCache.coureurs[data.dossard] = data;
            }
          });
          saveGlobalCache();
        });

        // Met à jour le cache toutes les 30 secondes
        setInterval(updateGlobalCache, 30000);

        // Recalcule currentTour toutes les 5 secondes
        setInterval(() => {
          if (startMs) {
            currentTour = calculateCurrentTour(startMs, limites);
          }
        }, 5000);
      });

      // Réinitialiser le scanner quand la page est visible
      const observer = new MutationObserver((mutations) => {
        mutations.forEach((mutation) => {
          if (mutation.attributeName === "style") {
            const lock = document.getElementById("lock");
            if (lock.style.display === "none") {
              initScanner();
            }
          }
        });
      });
      observer.observe(document.getElementById("lock"), { attributes: true });
    });

    // ARRIVEE MANUELLE
    document.getElementById("btn-arrivee").onclick = async() => {
      const dossard = Number(document.getElementById("arrivee-manuel").value.replace(/\D/g, ""));
      if (!dossard) {
        feedback("❌ Dossard invalide", "red");
        beepError.play();
        return;
      }
      await traiterArrivee(dossard, "MANUEL");
      document.getElementById("arrivee-manuel").value = "";
    };

    // DNF
    document.getElementById("btn-dnf").onclick = async() => {
      const dossard = document.getElementById("dossard-dnf").value.replace(/\D/g, "");
      if(!dossard) {
        feedback("❌ Dossard invalide", "red");
        return;
      }
      await changerStatut(dossard, "DNF");
      document.getElementById("dossard-dnf").value = "";
    };

    // DNS
    document.getElementById("btn-dns").onclick = async() => {
      const dossard = document.getElementById("dossard-dns").value.replace(/\D/g, "");
      if(!dossard) {
        feedback("❌ Dossard invalide", "red");
        return;
      }
      await changerStatut(dossard, "DNS");
      document.getElementById("dossard-dns").value = "";
    };

    // CHANGEMENT STATUT DNF / DNS
    async function changerStatut(dossard, type) {
      const coureur = globalCache.coureurs[dossard];
      if (!coureur) {
        feedback("❌ Dossard inconnu", "red");
        return;
      }

      if (["DNF", "DNS", "ELIMINE"].includes(coureur.statut)) {
        feedback(`⛔ Déjà ${coureur.statut}`, "red");
        return;
      }

      // Trouvez l'ID du document du coureur
      const q = query(collection(db, "coureurs"), where("dossard", "==", dossard));
      const snap = await getDocs(q);
      if (snap.empty) {
        feedback("❌ Dossard inconnu", "red");
        return;
      }
      const coureurDoc = snap.docs[0];
      await updateDoc(doc(db, "coureurs", coureurDoc.id), { statut: type });
      globalCache.coureurs[dossard].statut = type;
      saveGlobalCache();

      await addDoc(collection(db, "resultats"), {
        dossard,
        type,
        source: "MANUEL",
        timestamp: serverTimestamp()
      });

      // Créez un verrou local pour éviter les scans futurs
      const currentTour = calculateCurrentTour(startMs, limites);
      if (currentTour > 0) {
        const lockRef = doc(db, "scansLocks", `${dossard}_t${currentTour}`);
        await setDoc(lockRef, {
          dossard: dossard,
          tour: currentTour,
          createdAt: serverTimestamp()
        });
        globalCache.locks[`${dossard}_t${currentTour}`] = true;
        saveGlobalCache();
      }

      feedback(
        type === "DNF" ? `🏳️ DNF ${dossard}` : `🚫 DNS ${dossard}`,
        "orange"
      );
      beepError.play();
    }

    // Nettoyage à la fermeture
    window.addEventListener("beforeunload", () => {
      if (scanner) {
        scanner.clear();
      }
      cacheChannel.close();
    });
  </script>
</body>
</html>
