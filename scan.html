<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>SCAN COURSE</title>

  <!-- ✅ LIBRAIRIE QR -->
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>

<body style="background:#000;color:white;font-family:Arial;text-align:center;">

<!-- 🔒 VERROUILLAGE -->
<div id="lock" style="position:fixed;inset:0;background:black;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:9999;">
  <h2>🔒 Accès protégé</h2>
  <input id="pwd" type="password" placeholder="Mot de passe" style="padding:10px;font-size:20px">
  <button onclick="checkPwd()" style="padding:10px 20px;margin-top:10px;font-size:20px">Entrer</button>
  <div id="err" style="color:red;margin-top:10px"></div>
</div>

<script>
function checkPwd(){
  if(document.getElementById("pwd").value === "3sRunTravel2026"){
    document.getElementById("lock").style.display = "none";
  } else {
    document.getElementById("err").innerText = "Mot de passe incorrect";
  }
}
</script>

<h1>🏁 ARRIVÉES COURSE</h1>
<a href="index.html" style="color:gray;">⬅ Retour</a>

<div id="reader" style="width:320px;margin:20px auto;"></div>
<div id="feedback" style="font-size:26px;font-weight:bold;margin-top:20px;"></div>

<!-- 🏁 ARRIVÉE MANUELLE -->
<div style="margin-top:20px;">
  <input id="arrivee-manuel" placeholder="Dossard arrivée" style="padding:10px;font-size:18px;">
  <button id="btn-arrivee" style="padding:10px 20px;font-size:18px;">✅ ARRIVÉE</button>
</div>

<!-- 🏳️ DNF -->
<div style="margin-top:10px;">
  <input id="dossard-dnf" placeholder="Dossard DNF" style="padding:10px;font-size:18px;">
  <button id="btn-dnf" style="padding:10px 20px;font-size:18px;">DNF</button>
</div>

<!-- 🚫 DNS -->
<div style="margin-top:10px;">
  <input id="dossard-dns" placeholder="Dossard DNS" style="padding:10px;font-size:18px;">
  <button id="btn-dns" style="padding:10px 20px;font-size:18px;">DNS</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import {
  getFirestore, collection, query, where, getDocs,
  addDoc, updateDoc, doc,
  orderBy, limit, serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const beepOk = new Audio("https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg");
const beepError = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");

/* 🔒 ANTI-DOUBLON GLOBAL 10 MINUTES */
async function checkCooldown(dossard){
  const q = query(
    collection(db,"resultats"),
    where("dossard","==",dossard),
    orderBy("timestamp","desc"),
    limit(1)
  );
  const snap = await getDocs(q);
  if(snap.empty) return true;

  const last = snap.docs[0].data().timestamp?.toDate()?.getTime() ?? 0;
  return Date.now() - last > 600000;
}

/* ✅ LOGIQUE UNIQUE ARRIVÉE (SCAN + MANUEL) */
async function traiterArrivee(dossard, mode){

  if(!dossard){
    feedback("❌ Dossard invalide","red");
    beepError.play();
    return;
  }

  if(!(await checkCooldown(dossard))){
    feedback("⏳ Doublon interdit (<10 min)","orange");
    beepError.play();
    return;
  }

  const qCoureur = query(collection(db,"coureurs"), where("dossard","==",dossard));
  const snapCoureur = await getDocs(qCoureur);

  if(snapCoureur.empty){
    feedback("❌ Dossard inconnu : "+dossard,"red");
    beepError.play();
    return;
  }

  const coureur = snapCoureur.docs[0].data();
  if(["DNS","DNF","ELIMINE"].includes(coureur.statut)){
    feedback("⛔ Coureur non autorisé","red");
    beepError.play();
    return;
  }

  /* 🧮 CALCUL DU TOUR */
  const qTours = query(
    collection(db,"resultats"),
    where("dossard","==",dossard),
    where("type","==","PASSAGE")
  );
  const snapTours = await getDocs(qTours);
  const tour = snapTours.size + 1;

  /* ✅ ENREGISTREMENT COMPLET */
  await addDoc(collection(db,"resultats"),{
    dossard,
    type: "PASSAGE",
    tour: tour,
    mode: mode,
    timestamp: serverTimestamp()
  });

  beepOk.play();
  feedback(`✅ Arrivée enregistrée<br>Dossard ${dossard} – Tour ${tour}`,"lime");
}

/* 📷 SCAN QR */
const scanner = new Html5QrcodeScanner("reader",{ fps:10, qrbox:220 });
scanner.render(text=>{
  const d = text.split("-").pop().replace(/\D/g,"");
  traiterArrivee(d,"SCAN");
});

/* 🏁 ARRIVÉE MANUELLE */
document.getElementById("btn-arrivee").onclick = ()=>{
  const d = document.getElementById("arrivee-manuel").value.replace(/\D/g,"");
  traiterArrivee(d,"MANUEL");
};

/* 🏳️ DNF */
document.getElementById("btn-dnf").onclick = async ()=>{
  const d = document.getElementById("dossard-dnf").value.replace(/\D/g,"");
  if(!(await checkCooldown(d))){
    feedback("⏳ Doublon interdit","orange"); return;
  }

  const q = query(collection(db,"coureurs"), where("dossard","==",d));
  const snap = await getDocs(q);
  if(snap.empty) return feedback("❌ Dossard inconnu","red");

  await updateDoc(doc(db,"coureurs",snap.docs[0].id),{ statut:"DNF" });
  await addDoc(collection(db,"resultats"),{
    dossard:d,
    type:"DNF",
    timestamp:serverTimestamp()
  });

  beepError.play();
  feedback("🏳️ DNF enregistré : "+d,"orange");
};

/* 🚫 DNS */
document.getElementById("btn-dns").onclick = async ()=>{
  const d = document.getElementById("dossard-dns").value.replace(/\D/g,"");
  if(!(await checkCooldown(d))){
    feedback("⏳ Doublon interdit","orange"); return;
  }

  const q = query(collection(db,"coureurs"), where("dossard","==",d));
  const snap = await getDocs(q);
  if(snap.empty) return feedback("❌ Dossard inconnu","red");

  await updateDoc(doc(db,"coureurs",snap.docs[0].id),{ statut:"DNS" });
  await addDoc(collection(db,"resultats"),{
    dossard:d,
    type:"DNS",
    timestamp:serverTimestamp()
  });

  beepError.play();
  feedback("🚫 DNS enregistré : "+d,"orange");
};

function feedback(msg,color){
  const f=document.getElementById("feedback");
  f.style.color=color;
  f.innerHTML=msg;
}
</script>

</body>
</html>
