<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCAN COURSE</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
body {
  background: #000;
  color: white;
  font-family: Arial, Helvetica, sans-serif;
  text-align: center;
  margin: 0;
  padding: 20px;
  min-height: 100vh;
}

h1 {
  margin-top: 20px;
}

button {
  padding: 12px 20px;
  font-size: 18px;
  margin: 8px;
  cursor: pointer;
  border-radius: 8px;
  border: none;
  background: #333;
  color: white;
}

input {
  padding: 12px;
  font-size: 18px;
  width: 220px;
  border-radius: 8px;
  border: none;
  text-align: center;
  background: #222;
  color: white;
  margin: 5px;
}

#feedback {
  font-size: 28px;
  font-weight: bold;
  margin-top: 25px;
  min-height: 40px;
}

.zone {
  margin: 15px auto;
  padding: 10px;
  max-width: 400px;
}

#lock {
  position: fixed;
  inset: 0;
  background: black;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

#err {
  margin-top: 15px;
  font-weight: bold;
  color: red;
}

/* Correction : Positionnement des champs sous le scanner */
#scanner-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-bottom: 10px; /* Réduit l'espace sous le scanner */
  position: relative;
  z-index: 1;
}

#reader {
  width: 280px; /* Réduit la largeur */
  height: 200px; /* Réduit la hauteur */
  margin: 10px auto;
  background: #111;
  border-radius: 10px;
  border: 2px solid #444;
  max-width: 90%; /* S'adapte à l'écran */
  max-height: 30vh; /* Limite la hauteur en mobile */
  overflow: hidden;
}

#input-zone {
  margin-top: 10px; /* Réduit l'espace entre le scanner et les champs */
  width: 100%;
  max-width: 300px; /* Aligné avec la largeur du scanner */
  position: relative;
  z-index: 2;
  background: rgba(0, 0, 0, 0.7);
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #444;
}

@media (max-width: 768px) {
  #reader {
    width: 90%;
    height: 180px; /* Encore plus compact en mobile */
    max-height: 25vh;
  }
  #input-zone {
    margin-top: 5px;
    padding: 8px;
  }
  input {
    width: 100%;
    max-width: 280px;
  }
  button {
    width: 100%;
    max-width: 280px;
  }
}

  /* ===== NOUVEAUX STYLES POUR ÉVITER LE CHEVAUCHEMENT ===== */
  #scanner-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 20px;
    /* Ajout : Empêche le chevauchement avec les éléments suivants */
    position: relative;
    z-index: 1;
  }

  #reader {
    width: 320px;
    height: 240px;
    margin: 20px auto;
    background: #111;
    border-radius: 10px;
    border: 2px solid #444;
    /* Ajout : Limite la taille maximale pour éviter l'expansion */
    max-width: 100%;
    max-height: 50vh; /* ou une valeur fixe comme 300px */
    overflow: hidden; /* Masque tout débordement */
  }

  #input-zone {
    margin-top: 20px;
    width: 100%;
    max-width: 400px;
    /* Ajout : Force un positionnement sous le scanner */
    position: relative;
    z-index: 2; /* Supérieur à celui du scanner */
    background: rgba(0, 0, 0, 0.7); /* Fond semi-transparent pour mieux voir */
    padding: 15px;
    border-radius: 10px;
    border: 1px solid #444;
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 768px) {
    #reader {
      width: 90%;
      height: 200px;
      max-height: 30vh; /* Limite stricte en mobile */
    }

    #input-zone {
      margin-top: 10px; /* Réduit l'espace en mobile */
      padding: 10px;
    }
</style>
</head>

<body>
<div id="lock">
  <h2>🔒 Accès protégé</h2>
  <input id="pwd" type="password" placeholder="Mot de passe">
  <button onclick="checkPwd()">Entrer</button>
  <div id="err"></div>
</div>

<div id="scanner-container">
  <h1>🏁 ARRIVÉES COURSE</h1>
  <div id="reader"></div>
  <div id="feedback"></div>
</div>

<div id="input-zone">
  <div class="zone">
    <input id="arrivee-manuel" placeholder="Dossard arrivée">
    <button id="btn-arrivee">✅ ARRIVÉE</button>
  </div>

  <div class="zone">
    <input id="dossard-dnf" placeholder="Dossard DNF">
    <button id="btn-dnf">🏳️ DNF</button>
  </div>

  <div class="zone">
    <input id="dossard-dns" placeholder="Dossard DNS">
    <button id="btn-dns">🚫 DNS</button>
  </div>
</div>

<script>
// AUTHENTIFICATION LOCALE
const SESSION_DURATION = 30 * 60 * 1000;

window.checkPwd = function() {
  const password = document.getElementById("pwd").value;
  if(password === "3sRunTravel2026") {
    localStorage.setItem("scanAuthTime", Date.now());
    unlock();
  } else {
    document.getElementById("err").innerHTML = "❌ Mot de passe incorrect";
  }
};

function unlock() {
  document.getElementById("lock").style.display = "none";
}

function checkSession() {
  const saved = localStorage.getItem("scanAuthTime");
  if(saved && (Date.now() - saved) < SESSION_DURATION) unlock();
}
checkSession();
</script>

<script type="module">
// FIREBASE IMPORT
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import {
  getFirestore, collection, query, where, getDocs, addDoc, updateDoc,
  doc, serverTimestamp, onSnapshot, getDoc, setDoc, runTransaction
} from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";

// INITIALISATION FIREBASE
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// VARIABLES COURSE
let startMs = null;
let limites = { t1:40, t2:37, t3:34, t4:31, t5:28, t6:25, t7:22, t8:19, t9:16, t10:13 };
let currentTour = 0;
let lastTourStartTime = null;
let runnerStatuses = {};
let lastScan = null;
let lastScanTime = 0;
let processing = false;

// Cache local pour les verrous et scans
const localScanCache = {
  locks: {},
  scans: {}
};

// SONS
const beepOk = new Audio("https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg");
const beepError = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");

// ======================
// 💾 Gestion du localStorage
// ======================
function saveLocalScanCache() {
  localStorage.setItem("scan_html_localScanCache", JSON.stringify(localScanCache));
}

function loadLocalScanCache() {
  const savedCache = localStorage.getItem("scan_html_localScanCache");
  if (savedCache) {
    try {
      const parsedCache = JSON.parse(savedCache);
      Object.assign(localScanCache.locks, parsedCache.locks || {});
      Object.assign(localScanCache.scans, parsedCache.scans || {});
    } catch (e) {
      console.error("Erreur chargement cache local:", e);
    }
  }
}

// Sauvegarder le cache toutes les 10 secondes
setInterval(saveLocalScanCache, 10000);

// Charger les coureurs une seule fois
async function loadRunnersFromFirebase() {
  try {
    const snap = await getDocs(collection(db, "coureurs"));
    snap.forEach(doc => {
      const data = doc.data();
      if (data.dossard) runnerStatuses[data.dossard] = data.statut;
    });
  } catch (e) {
    console.error("Erreur chargement coureurs:", e);
  }
}

// Charger les verrous et scans existants depuis Firebase
async function loadExistingLocksAndScans() {
  try {
    const locksSnap = await getDocs(collection(db, "scansLocks"));
    locksSnap.forEach(doc => {
      const data = doc.data();
      localScanCache.locks[`${data.dossard}_t${data.tour}`] = true;
    });

    const scansSnap = await getDocs(collection(db, "resultats"));
    scansSnap.forEach(doc => {
      const data = doc.data();
      localScanCache.scans[`${data.dossard}_t${data.tour}`] = data;
    });

    console.log("Verrous et scans chargés depuis Firebase dans scan.html.");
  } catch (error) {
    console.error("Erreur chargement verrous/scans:", error);
  }
}

// Charger les coureurs, verrous et scans au démarrage
loadRunnersFromFirebase().then(() => {
  loadLocalScanCache();
  loadExistingLocksAndScans();
});

// CALCUL TOUR ACTUEL
function updateCurrentTour() {
  if(!startMs) {
    currentTour = 0;
    lastTourStartTime = null;
    return;
  }
  const elapsed = (Date.now() - startMs) / 60000;
  let cumul = 0;
  let nouveauTour = 0;

  for(let i = 1; i <= 10; i++) {
    const limite = limites["t" + i];
    if(!limite) break;
    cumul += limite;
    if(elapsed <= cumul) {
      nouveauTour = i;
      break;
    }
  }

  if(nouveauTour === 0) nouveauTour = 10;

  if(nouveauTour !== currentTour) {
    let debut = 0;
    for(let i = 1; i < nouveauTour; i++) {
      debut += (limites["t" + i] || 0) * 60000;
    }
    lastTourStartTime = startMs + debut;
    currentTour = nouveauTour;
  }
}

// VERIFICATION HORS DELAI
async function isHorsDelai(tour) {
  if(!startMs) return false;
  let cumul = 0;
  for(let i = 1; i <= tour; i++) {
    cumul += limites["t" + i] || 0;
  }
  return (Date.now() - startMs) > cumul * 60000;
}

// LISTENERS FIREBASE
onSnapshot(doc(db, "course", "depart"), snap => {
  if(snap.exists()) {
    startMs = snap.data().startMs;
    updateCurrentTour();
  } else {
    startMs = null;
    currentTour = 0;
    lastTourStartTime = null;
  }
});

onSnapshot(doc(db, "course", "limitesTours"), snap => {

  console.log("Document limitesTours trouvé :", snap.exists());

  if (!snap.exists()) {
    console.error("course/limitesTours introuvable");
    return;
  }

  const data = snap.data();

  limites = {
    t1: Number(data.t1 || 0),
    t2: Number(data.t2 || 0),
    t3: Number(data.t3 || 0),
    t4: Number(data.t4 || 0),
    t5: Number(data.t5 || 0),
    t6: Number(data.t6 || 0),
    t7: Number(data.t7 || 0),
    t8: Number(data.t8 || 0),
    t9: Number(data.t9 || 0),
    t10: Number(data.t10 || 0)
  };

  console.log("Limites chargées depuis Firebase :", limites);

  updateCurrentTour();

  console.log("Tour actuel recalculé :", currentTour);
});

onSnapshot(collection(db, "coureurs"), snap => {
  runnerStatuses = {};
  snap.forEach(d => {
    const data = d.data();
    if(data.dossard) runnerStatuses[data.dossard] = data.statut;
  });
});

// AFFICHAGE MESSAGE
window.feedback = function(message, couleur) {
  const zone = document.getElementById("feedback");
  zone.innerHTML = message;
  zone.style.color = couleur;
};

// TRAITEMENT ARRIVEE
async function traiterArrivee(dossard, source) {
  if(!startMs) {
    feedback("⛔ Course non démarrée", "red");
    beepError.play();
    return;
  }

  if(!dossard) {
    feedback("❌ Dossard invalide", "red");
    return;
  }

  // Vérifier le statut du coureur
  if (runnerStatuses[dossard] && ["DNS", "DNF", "ELIMINE"].includes(runnerStatuses[dossard])) {
    feedback(`⛔ ${runnerStatuses[dossard]}`, "red");
    beepError.play();
    return;
  }

  // Trouver le dernier tour scanné (via cache local)
  let dernierTour = 0;
  for (const key in localScanCache.scans) {
    if (key.startsWith(`${dossard}_t`)) {
      const tour = parseInt(key.split("_t")[1]);
      if (tour > dernierTour) dernierTour = tour;
    }
  }
  const prochainTour = dernierTour + 1;

  if(prochainTour > currentTour) {
    feedback(`⛔ Tour ${prochainTour} non encore ouvert (tour actuel: ${currentTour})`, "orange");
    beepError.play();
    return;
  }

  // Vérifier le verrou local
  if (localScanCache.locks[`${dossard}_t${prochainTour}`]) {
    feedback(`⛔ Déjà scanné pour le tour ${prochainTour}`, "orange");
    beepError.play();
    return;
  }

  // Vérifier le verrou dans Firebase (pour éviter les conflits entre onglets)
  const lockRef = doc(db, "scansLocks", `${dossard}_t${prochainTour}`);
  const lockSnap = await getDoc(lockRef);
  if (lockSnap.exists()) {
    // Mettre à jour le cache local
    localScanCache.locks[`${dossard}_t${prochainTour}`] = true;
    feedback(`⛔ Déjà scanné pour le tour ${prochainTour}`, "orange");
    beepError.play();
    return;
  }

  // Vérifier le délai de 3 minutes si dernier scan = tour précédent
  if (dernierTour === currentTour - 1 && lastTourStartTime) {
    const timeSinceStart = Date.now() - lastTourStartTime;
    if (timeSinceStart < 180000) {
      const remainingSeconds = Math.ceil((180000 - timeSinceStart) / 1000);
      feedback(`⏳ Attendez ${remainingSeconds}s pour le tour ${prochainTour}`, "orange");
      beepError.play();
      return;
    }
  }

  // Créer le verrou dans Firebase
  try {
    await runTransaction(db, async(transaction) => {
      const lock = await transaction.get(lockRef);
      if(lock.exists()) throw new Error("LOCK");
      transaction.set(lockRef, {
        dossard,
        tour: prochainTour,
        source,
        createdAt: serverTimestamp()
      });
    });
  } catch(e) {
    // Mettre à jour le cache local en cas d'erreur
    localScanCache.locks[`${dossard}_t${prochainTour}`] = true;
    feedback("⛔ Déjà enregistré", "orange");
    return;
  }

  // Mettre à jour le cache local
  localScanCache.locks[`${dossard}_t${prochainTour}`] = true;

  // Vérifier hors délai
  const horsDelai = await isHorsDelai(prochainTour);
  if(horsDelai) {
    await addDoc(collection(db, "resultats"), {
      dossard,
      tour: prochainTour,
      horsDelai: true,
      source,
      timestamp: serverTimestamp()
    });

    // Trouver le document du coureur pour le marquer comme ELIMINE
    const coureurSnap = await getDocs(
      query(collection(db, "coureurs"), where("dossard", "==", String(dossard)))
    );
    if (!coureurSnap.empty) {
      await updateDoc(doc(db, "coureurs", coureurSnap.docs[0].id), { statut: "ELIMINE" });
      runnerStatuses[dossard] = "ELIMINE";
    }

    localScanCache.scans[`${dossard}_t${prochainTour}`] = { horsDelai: true };
    feedback(`🚨 ${dossard} HORS DELAI`, "red");
    beepError.play();
    return;
  }

  // Enregistrer le scan
  await addDoc(collection(db, "resultats"), {
    dossard,
    tour: prochainTour,
    horsDelai: false,
    source,
    timestamp: serverTimestamp()
  });

  localScanCache.scans[`${dossard}_t${prochainTour}`] = { horsDelai: false };

  // Feedback
  let couleur = "lime";
  const coureur = { sexe: runnerStatuses[dossard] === "F" ? "F" : "H" };
  if(coureur.sexe === "F") couleur = "violet";
  if(coureur.sexe === "H") couleur = "cyan";

  feedback(`✅ ${dossard} - TOUR ${prochainTour}`, couleur);
  beepOk.play();
}

// SCANNER QR
let scanner;
function initScanner() {
  if (scanner) {
    scanner.clear();
  }
  scanner = new Html5QrcodeScanner("reader", {
    fps: 10,
    qrbox: 200,
    rememberLastUsedCamera: true,
    showTorchButtonIfSupported: true
  });
  scanner.render(async(text) => {
    const dossard = Number(text.replace(/\D/g, ""));
    if(!dossard) {
      feedback("❌ QR invalide", "red");
      beepError.play();
      return;
    }
    const now = Date.now();
    if(dossard === lastScan && now - lastScanTime < 3000) return;
    if(processing) return;

    lastScan = dossard;
    lastScanTime = now;
    processing = true;
    try {
      await traiterArrivee(dossard, "SCAN");
    } finally {
      setTimeout(() => { processing = false; }, 1500);
    }
  });
}

// Initialiser le scanner après déverrouillage
window.addEventListener("DOMContentLoaded", () => {
  // Réinitialiser le scanner quand la page est visible
  const observer = new MutationObserver((mutations) => {
    mutations.forEach((mutation) => {
      if (mutation.attributeName === "style") {
        const lock = document.getElementById("lock");
        if (lock.style.display === "none") {
          initScanner();
        }
      }
    });
  });
  observer.observe(document.getElementById("lock"), { attributes: true });
});

// ARRIVEE MANUELLE
document.getElementById("btn-arrivee").onclick = async() => {
  const dossard = Number(document.getElementById("arrivee-manuel").value.replace(/\D/g, ""));
  if (!dossard) {
    feedback("❌ Dossard invalide", "red");
    beepError.play();
    return;
  }
  await traiterArrivee(dossard, "MANUEL");
  document.getElementById("arrivee-manuel").value = "";
};

// DNF
document.getElementById("btn-dnf").onclick = async() => {
  const dossard = document.getElementById("dossard-dnf").value.replace(/\D/g, "");
  if(!dossard) {
    feedback("❌ Dossard invalide", "red");
    return;
  }
  await changerStatut(dossard, "DNF");
  document.getElementById("dossard-dnf").value = "";
};

// DNS
document.getElementById("btn-dns").onclick = async() => {
  const dossard = document.getElementById("dossard-dns").value.replace(/\D/g, "");
  if(!dossard) {
    feedback("❌ Dossard invalide", "red");
    return;
  }
  await changerStatut(dossard, "DNS");
  document.getElementById("dossard-dns").value = "";
};

// CHANGEMENT STATUT DNF / DNS
async function changerStatut(dossard, type) {
  const snap = await getDocs(
    query(collection(db, "coureurs"), where("dossard", "==", dossard))
  );

  if(snap.empty) {
    feedback("❌ Dossard inconnu", "red");
    return;
  }

  const coureurDoc = snap.docs[0];
  const coureur = coureurDoc.data();

  if(["DNF", "DNS", "ELIMINE"].includes(coureur.statut)) {
    feedback(`⛔ Déjà ${coureur.statut}`, "red");
    return;
  }

  await updateDoc(doc(db, "coureurs", coureurDoc.id), { statut: type });
  runnerStatuses[dossard] = type;

  await addDoc(collection(db, "resultats"), {
    dossard,
    type,
    source: "MANUEL",
    timestamp: serverTimestamp()
  });

  // Créer un verrou local pour éviter les scans futurs
  localScanCache.locks[`${dossard}_t${currentTour || 1}`] = true;

  feedback(
    type === "DNF" ? `🏳️ DNF ${dossard}` : `🚫 DNS ${dossard}`,
    "orange"
  );
  beepError.play();
}

// Nettoyage à la fermeture
window.addEventListener("beforeunload", () => {
  if (scanner) {
    scanner.clear();
  }
});
</script>
</body>
</html>
